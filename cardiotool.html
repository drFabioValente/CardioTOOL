<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CardioTools Pro - Definitivo</title>
<style>
:root{
  --bg:#0b1020; --panel:#151d38; --panel2:#1a2345; --border:#2a3568;
  --txt:#edf2ff; --muted:#aeb8d8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);background:
radial-gradient(850px 500px at 15% 10%, #203063 0%, transparent 60%),
radial-gradient(900px 500px at 85% 85%, #431424 0%, transparent 55%),var(--bg);}
.app{display:grid;grid-template-columns:320px 1fr;height:100dvh}
.sidebar{border-right:1px solid var(--border);background:rgba(10,14,28,.65);padding:16px 14px 20px;display:flex;flex-direction:column;min-height:0}
.brand{padding:8px 8px 14px}.brand h1{margin:0;font-size:1.35rem}.brand p{margin:.25rem 0 0;color:var(--muted);font-size:.9rem}
.searchbox{margin:4px 4px 10px}.searchbox input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--txt);outline:none}
.side-scroll{overflow-y:auto;min-height:0;padding-right:4px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.section-title{margin:16px 8px 8px;color:#cfd8ff;opacity:.8;font-size:.73rem;text-transform:uppercase;letter-spacing:.11em}
.btn{width:100%;border:1px solid var(--border);background:linear-gradient(180deg,#1a2345 0%,#141c35 100%);color:var(--txt);border-radius:12px;padding:11px 12px;text-align:left;margin:0 4px 8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn:hover{transform:translateY(-1px);border-color:#4a61b7}.btn.active{outline:2px solid rgba(87,166,255,.45)}
.btn .left{display:flex;flex-direction:column;gap:2px}.btn .name{font-weight:700}.btn .meta{font-size:.78rem;color:var(--muted)}
.fav{border:none;background:transparent;color:#ffd86b;font-size:1rem;cursor:pointer}
.main{min-width:0;overflow:auto;padding:24px}
.card{background:rgba(18,25,51,.88);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.hero h2{margin:.1rem 0 .35rem}.hero p{color:var(--muted);line-height:1.45}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.badge{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:6px 10px;color:#dce6ff;font-size:.82rem}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{border:1px solid var(--border);border-radius:14px;padding:12px;background:rgba(26,35,69,.55)}.field.full{grid-column:1/-1}.field label{display:block;font-size:.9rem;margin-bottom:8px;font-weight:600}.field small{display:block;color:var(--muted);margin-top:6px}
select,input[type="number"],input[type="text"]{width:100%;padding:10px 11px;border-radius:10px;border:1px solid #3a487f;background:#0e152b;color:var(--txt)}
.checkbox{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:rgba(26,35,69,.45)}.checkbox input{margin-top:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}.primary{border:1px solid #4f7fff;background:linear-gradient(180deg,#4f86ff,#3467dd);color:white}.secondary{border:1px solid var(--border);background:#111936;color:var(--txt)}
.result h3{margin:0 0 8px}.result .big{font-size:2rem;font-weight:800;margin:6px 0}.result .interp{color:#dfe8ff;line-height:1.45}.result .note{color:var(--muted);font-size:.92rem;margin-top:10px}
.table{width:100%;border-collapse:collapse;margin-top:8px}.table th,.table td{border-bottom:1px solid #2a3568;padding:8px 6px;text-align:left;font-size:.92rem}
.empty{text-align:center;padding:42px 18px;color:var(--muted)}.help{color:var(--muted);font-size:.92rem;line-height:1.45}
.warn{border:1px solid #6e5c20;background:rgba(255,176,32,.08);color:#ffe9b0;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.92rem}
code.inline{background:#0e152b;padding:2px 6px;border-radius:6px}
@media (max-width: 980px){.app{grid-template-columns:1fr}.sidebar{height:38dvh;border-right:none;border-bottom:1px solid var(--border)}.hero,.grid,.form-grid{grid-template-columns:1fr}.main{padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><h1>CardioTools Pro</h1><p>Score cardiologici con dettagli di calcolo, preferiti e ricerca.</p></div>
  <div class="searchbox"><input id="search" type="text" placeholder="Cerca score..." /></div>
  <div class="side-scroll" id="menu"></div>
</aside>
<main class="main" id="main"></main>
</div>
<script>
const groups=[{key:"daily",label:"Uso quotidiano"},{key:"tep",label:"TEP"},{key:"fa",label:"FA score"},{key:"sca",label:"SCA / Antitrombotici"},{key:"hf",label:"Scompenso / Congestione"},{key:"cardio",label:"Cardiomiopatie / Aritmie"},{key:"utility",label:"Utility cliniche"}];
const tools=[
{id:"chadsvasc",group:"fa",name:"CHA₂DS₂-VASc",meta:"Rischio tromboembolico FA",favorite:true},
{id:"hasbled",group:"fa",name:"HAS-BLED",meta:"Rischio emorragico",favorite:true},
{id:"orbit",group:"fa",name:"ORBIT",meta:"Bleeding score FA",favorite:true},
{id:"heart",group:"daily",name:"HEART",meta:"Dolore toracico / ACS",favorite:true},
{id:"grace",group:"sca",name:"GRACE",meta:"Modulo dettagliato",favorite:false},
{id:"wells",group:"tep",name:"Wells PE",meta:"Probabilità clinica TEP",favorite:true},
{id:"geneva",group:"tep",name:"Revised Geneva",meta:"Probabilità clinica TEP",favorite:true},
{id:"perc",group:"tep",name:"PERC",meta:"Rule-out TEP",favorite:true},
{id:"pesi",group:"tep",name:"PESI",meta:"Prognosi TEP",favorite:false},
{id:"spesi",group:"tep",name:"sPESI",meta:"Prognosi TEP",favorite:true},
{id:"bova",group:"tep",name:"Bova",meta:"Rischio deterioramento",favorite:false},
{id:"timi",group:"sca",name:"TIMI UA/NSTEMI",meta:"Rischio SCA",favorite:false},
{id:"dapt",group:"sca",name:"DAPT",meta:"Valutazione prolungamento DAPT",favorite:false},
{id:"precise",group:"sca",name:"PRECISE-DAPT",meta:"Bleeding risk",favorite:false},
{id:"egfr",group:"utility",name:"eGFR CKD-EPI 2021",meta:"Funzione renale",favorite:true},
{id:"cg",group:"utility",name:"Cockcroft-Gault",meta:"Creatinine clearance",favorite:false},
{id:"ldl",group:"utility",name:"LDL Friedewald",meta:"Colesterolo LDL",favorite:false},
{id:"qtc",group:"utility",name:"QTc",meta:"Bazett / Fridericia",favorite:true},
{id:"bmi",group:"utility",name:"BMI + BSA",meta:"Antropometria",favorite:false},
{id:"vexus",group:"hf",name:"VExUS",meta:"Calcolatore attivo",favorite:true},
{id:"hfpef",group:"hf",name:"H₂FPEF",meta:"Modulo dettagliato",favorite:false},
{id:"hfapeff",group:"hf",name:"HFA-PEFF",meta:"Modulo dettagliato",favorite:false},
{id:"hcm",group:"cardio",name:"HCM Risk-SCD",meta:"Ora funzionante",favorite:false}
];
const state={current:"hcm",favorites:JSON.parse(localStorage.getItem("cardio_favs")||"[]")};
function isFav(id){return state.favorites.includes(id)||tools.find(t=>t.id===id)?.favorite}
function toggleFav(id,ev){ev.stopPropagation();const i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);localStorage.setItem("cardio_favs",JSON.stringify(state.favorites));renderMenu()}
function renderMenu(){const q=document.getElementById('search').value.trim().toLowerCase();const menu=document.getElementById('menu');let html='';const favTools=tools.filter(t=>isFav(t.id)&&(t.name.toLowerCase().includes(q)||t.meta.toLowerCase().includes(q)));if(favTools.length){html+=`<div class="section-title">Preferiti</div>`;favTools.forEach(t=>html+=menuButton(t))}groups.forEach(g=>{const items=tools.filter(t=>t.group===g.key&&(t.name.toLowerCase().includes(q)||t.meta.toLowerCase().includes(q)));if(!items.length)return;html+=`<div class="section-title">${g.label}</div>`;items.forEach(t=>html+=menuButton(t))});if(!html)html=`<div class="empty">Nessun risultato</div>`;menu.innerHTML=html}
function menuButton(t){const active=t.id===state.current?'active':'';return `<button class="btn ${active}" onclick="openTool('${t.id}')"><span class="left"><span class="name">${t.name}</span><span class="meta">${t.meta}</span></span><span class="fav" onclick="toggleFav('${t.id}', event)">${isFav(t.id)?'★':'☆'}</span></button>`}
document.addEventListener('input',(e)=>{if(e.target.id==='search')renderMenu()});
function openTool(id){state.current=id;renderMenu();document.getElementById('main').innerHTML=renderTool(id)}
function num(id){return parseFloat(document.getElementById(id)?.value||0)}
function checked(id){return document.getElementById(id)?.checked?1:0}
function val(id){return document.getElementById(id)?.value||''}
function selNum(id){return parseFloat(val(id)||0)}
function setResult(html){document.getElementById('result').innerHTML=html}
function resetForm(formId){document.getElementById(formId).reset();setResult(`<h3>Risultato</h3><div class="note">Compila i campi e premi “Calcola”.</div>`)}
function interpPesi(score){if(score<=65)return'Classe I – rischio molto basso';if(score<=85)return'Classe II – rischio basso';if(score<=105)return'Classe III – rischio intermedio';if(score<=125)return'Classe IV – rischio alto';return'Classe V – rischio molto alto'}
function renderTool(id){const defs={heart:heartTool(),chadsvasc:chadsTool(),hasbled:hasbledTool(),orbit:orbitTool(),wells:wellsTool(),geneva:genevaTool(),perc:percTool(),pesi:pesiTool(),spesi:spesiTool(),bova:bovaTool(),timi:timiTool(),dapt:daptTool(),precise:preciseTool(),egfr:egfrTool(),cg:cgTool(),ldl:ldlTool(),qtc:qtcTool(),bmi:bmiTool(),grace:infoTool("GRACE score","Ho lasciato un modulo dettagliato con variabili e formula non semplificata. Se vuoi, nel prossimo step posso aggiungere la versione completa con tutte le variabili numeriche e le categorie di età/pressione/creatinina.",["Età","FC","PAS","Creatinina","Killip","ST deviation","Troponina","Arresto cardiaco all'arrivo"]),vexus:vexusTool(),hfpef:hfpefTool(),hfapeff:infoTool("HFA-PEFF","Algoritmo strutturato in domini funzionale, morfologico e biomarcatori. Utile ma più adatto a una schermata dedicata con eco e NT-proBNP.",["Dominio funzionale","Dominio morfologico","Biomarcatori","Stress test / cateterismo se indeterminato"]),hcm:hcmTool()};return defs[id]||`<div class="card"><div class="empty">Modulo non disponibile.</div></div>`}
function shell(title,subtitle,badges,formHtml){return `<div class="hero"><section class="card"><h2>${title}</h2><p>${subtitle}</p><div class="badges">${badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div></section><section class="card result" id="result"><h3>Risultato</h3><div class="note">Compila i campi e premi “Calcola”.</div></section></div><div class="grid"><section class="card">${formHtml}</section><section class="card help"><h3 style="margin-top:0">Dettagli di calcolo</h3><div id="detailsBox"></div></section></div>`}
function details(html){document.getElementById('detailsBox').innerHTML=html}
function cb(id,label){return `<label class="checkbox"><input id="${id}" type="checkbox" /><span>${label}</span></label>`}
function chadsTool(){setTimeout(()=>details(`<table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>Scompenso / FE ridotta</td><td>1</td></tr><tr><td>Ipertensione</td><td>1</td></tr><tr><td>Età ≥75</td><td>2</td></tr><tr><td>Diabete</td><td>1</td></tr><tr><td>Stroke/TIA/TE pregresso</td><td>2</td></tr><tr><td>Vasculopatia</td><td>1</td></tr><tr><td>Età 65–74</td><td>1</td></tr><tr><td>Sesso femminile</td><td>1</td></tr></table>`),0);return shell("CHA₂DS₂-VASc","Score di rischio tromboembolico nella fibrillazione atriale non valvolare.",["FA","Stroke risk","Dettagli completi"],`<form id="f_chads"><div class="form-grid">${cb('c_hf','Scompenso cardiaco / FE ridotta')}${cb('c_htn','Ipertensione')}${cb('c_dm','Diabete mellito')}${cb('c_stroke','Pregresso stroke/TIA/TE')}${cb('c_vasc','Vasculopatia')}<div class="field"><label>Età</label><select id="c_age"><option value="0">&lt;65</option><option value="1">65–74</option><option value="2">≥75</option></select></div><div class="field"><label>Sesso</label><select id="c_sex"><option value="0">Maschio</option><option value="1">Femmina</option></select></div></div><div class="actions"><button type="button" class="primary" onclick="calcChads()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_chads')">Reset</button></div></form>`)}
function calcChads(){const score=checked('c_hf')+checked('c_htn')+checked('c_dm')+2*checked('c_stroke')+checked('c_vasc')+selNum('c_age')+selNum('c_sex');let risk='Basso';if(score>=2)risk='Elevato';else if(score===1)risk='Intermedio';setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp">Rischio tromboembolico: <b>${risk}</b>.</div><div class="note">Interpretazione clinica da contestualizzare con linee guida, sesso e profilo del paziente.</div>`)}
function hasbledTool(){setTimeout(()=>details(`<table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>Ipertensione</td><td>1</td></tr><tr><td>Funzione renale alterata</td><td>1</td></tr><tr><td>Funzione epatica alterata</td><td>1</td></tr><tr><td>Stroke pregresso</td><td>1</td></tr><tr><td>Pregresso bleeding / predisposizione</td><td>1</td></tr><tr><td>INR labile</td><td>1</td></tr><tr><td>Età &gt;65</td><td>1</td></tr><tr><td>Farmaci predisponenti</td><td>1</td></tr><tr><td>Alcol</td><td>1</td></tr></table>`),0);return shell("HAS-BLED","Score di rischio emorragico nel paziente con fibrillazione atriale.",["FA","Bleeding risk"],`<form id="f_hasbled"><div class="form-grid">${cb('h_htn','Ipertensione non controllata')}${cb('h_renal','Funzione renale alterata')}${cb('h_liver','Funzione epatica alterata')}${cb('h_stroke','Stroke pregresso')}${cb('h_bleed','Pregresso sanguinamento')}${cb('h_inr','INR labile')}${cb('h_age','Età > 65 anni')}${cb('h_drugs','Farmaci predisponenti')}${cb('h_alcohol','Alcol')}</div><div class="actions"><button type="button" class="primary" onclick="calcHasbled()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_hasbled')">Reset</button></div></form>`)}
function calcHasbled(){const ids=['h_htn','h_renal','h_liver','h_stroke','h_bleed','h_inr','h_age','h_drugs','h_alcohol'];const score=ids.reduce((s,id)=>s+checked(id),0);let txt=score>=3?'Rischio emorragico alto':'Rischio non alto';setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp"><b>${txt}</b>.</div><div class="note">Uno score elevato non controindica automaticamente l’anticoagulazione: identifica fattori modificabili e richiede follow-up.</div>`)}
function orbitTool(){setTimeout(()=>details(`<table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>Età ≥75 anni</td><td>1</td></tr><tr><td>eGFR &lt;60 mL/min/1.73m²</td><td>1</td></tr><tr><td>Terapia antiaggregante</td><td>1</td></tr><tr><td>Bleeding history</td><td>2</td></tr><tr><td>Hb bassa / anemia</td><td>2</td></tr></table><p>Classi: 0–2 basso, 3 intermedio, ≥4 alto.</p>`),0);return shell("ORBIT","Bleeding score per pazienti con fibrillazione atriale.",["FA","Bleeding risk","Dettagli completi"],`<form id="f_orbit"><div class="form-grid">${cb('o_age','Età ≥75 anni')}${cb('o_egfr','eGFR <60')}${cb('o_antiplt','Terapia antiaggregante')}${cb('o_bleed','Pregresso sanguinamento')}${cb('o_anemia','Hb bassa / anemia')}</div><div class="actions"><button type="button" class="primary" onclick="calcOrbit()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_orbit')">Reset</button></div></form>`)}
function calcOrbit(){const score=checked('o_age')+checked('o_egfr')+checked('o_antiplt')+2*checked('o_bleed')+2*checked('o_anemia');let cls=score<=2?'Basso':score===3?'Intermedio':'Alto';setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp">Rischio emorragico ORBIT: <b>${cls}</b>.</div>`)}
function wellsTool(){setTimeout(()=>details(`<table class="table"><tr><th>Criterio</th><th>Punti</th></tr><tr><td>Segni clinici TVP</td><td>3</td></tr><tr><td>TEP più probabile di diagnosi alternativa</td><td>3</td></tr><tr><td>FC &gt;100/min</td><td>1.5</td></tr><tr><td>Immobilizzazione ≥3 giorni o chirurgia recente</td><td>1.5</td></tr><tr><td>Pregressa TVP/TEP</td><td>1.5</td></tr><tr><td>Emottisi</td><td>1</td></tr><tr><td>Neoplasia attiva</td><td>1</td></tr></table><p>Interpretazione: ≤4 TEP improbabile; &gt;4 TEP probabile.</p>`),0);return shell("Wells score – TEP","Probabilità clinica pre-test di embolia polmonare.",["TEP","Dettagli completi"],`<form id="f_wells"><div class="form-grid">${cb('w_dvt','Segni clinici di TVP')}${cb('w_alt','TEP più probabile di diagnosi alternativa')}${cb('w_hr','Frequenza cardiaca >100/min')}${cb('w_imm','Immobilizzazione ≥3 gg o chirurgia recente')}${cb('w_prev','Pregressa TVP/TEP')}${cb('w_hemo','Emottisi')}${cb('w_cancer','Neoplasia attiva')}</div><div class="actions"><button type="button" class="primary" onclick="calcWells()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_wells')">Reset</button></div></form>`)}
function calcWells(){const score=3*checked('w_dvt')+3*checked('w_alt')+1.5*checked('w_hr')+1.5*checked('w_imm')+1.5*checked('w_prev')+checked('w_hemo')+checked('w_cancer');const cls=score>4?'TEP probabile':'TEP improbabile';setResult(`<h3>Risultato</h3><div class="big">${score.toFixed(1)}</div><div class="interp"><b>${cls}</b>.</div>`)}
function genevaTool(){setTimeout(()=>details(`<table class="table"><tr><th>Criterio</th><th>Punti</th></tr><tr><td>Età &gt;65</td><td>1</td></tr><tr><td>TVP/TEP pregressa</td><td>3</td></tr><tr><td>Chirurgia/frattura ultimo mese</td><td>2</td></tr><tr><td>Neoplasia attiva</td><td>2</td></tr><tr><td>Dolore unilaterale arto inferiore</td><td>3</td></tr><tr><td>Emottisi</td><td>2</td></tr><tr><td>FC 75–94</td><td>3</td></tr><tr><td>FC ≥95</td><td>5</td></tr><tr><td>Dolore alla palpazione + edema unilaterale</td><td>4</td></tr></table><p>0–3 basso, 4–10 intermedio, ≥11 alto.</p>`),0);return shell("Revised Geneva","Probabilità clinica di TEP basata solo su dati clinici oggettivi.",["TEP","Dettagli completi"],`<form id="f_geneva"><div class="form-grid">${cb('g_age','Età > 65 anni')}${cb('g_prev','Pregressa TVP/TEP')}${cb('g_surg','Chirurgia/frattura nell’ultimo mese')}${cb('g_cancer','Neoplasia attiva')}${cb('g_legpain','Dolore unilaterale arto inferiore')}${cb('g_hemo','Emottisi')}<div class="field"><label>Frequenza cardiaca</label><select id="g_hr"><option value="0">&lt;75</option><option value="3">75–94</option><option value="5">≥95</option></select></div>${cb('g_dvt','Dolore alla palpazione vene profonde ed edema unilaterale')}</div><div class="actions"><button type="button" class="primary" onclick="calcGeneva()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_geneva')">Reset</button></div></form>`)}
function calcGeneva(){const score=checked('g_age')+3*checked('g_prev')+2*checked('g_surg')+2*checked('g_cancer')+3*checked('g_legpain')+2*checked('g_hemo')+selNum('g_hr')+4*checked('g_dvt');const cls=score>=11?'Alta probabilità':score>=4?'Probabilità intermedia':'Bassa probabilità';setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp"><b>${cls}</b>.</div>`)}
function percTool(){setTimeout(()=>details(`<p>La PERC è negativa solo se tutti gli 8 criteri sono assenti.</p><table class="table"><tr><th>Criterio PERC</th></tr><tr><td>Età &lt;50</td></tr><tr><td>FC &lt;100</td></tr><tr><td>SatO₂ ≥95%</td></tr><tr><td>No emottisi</td></tr><tr><td>No estrogeni</td></tr><tr><td>No chirurgia/trauma recente</td></tr><tr><td>No pregressa TVP/TEP</td></tr><tr><td>No segni clinici TVP</td></tr></table>`),0);return shell("PERC rule","Strumento di rule-out in pazienti a bassa probabilità clinica di TEP.",["TEP","Rule-out"],`<form id="f_perc"><div class="form-grid">${cb('p_age','Età < 50 anni')}${cb('p_hr','FC < 100/min')}${cb('p_sat','SatO₂ ≥ 95%')}${cb('p_hemo','Assenza di emottisi')}${cb('p_est','Assenza di estrogeni')}${cb('p_surg','Assenza di chirurgia/trauma recente')}${cb('p_prev','Assenza di pregressa TVP/TEP')}${cb('p_dvt','Assenza di segni clinici di TVP')}</div><div class="actions"><button type="button" class="primary" onclick="calcPerc()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_perc')">Reset</button></div></form>`)}
function calcPerc(){const pass=['p_age','p_hr','p_sat','p_hemo','p_est','p_surg','p_prev','p_dvt'].every(id=>checked(id));setResult(`<h3>Risultato</h3><div class="big">${pass?'PERC−':'PERC+'}</div><div class="interp">${pass?'<b>Tutti i criteri soddisfatti</b>: in contesto di bassa probabilità clinica può supportare rule-out senza D-dimero.':'<b>Almeno un criterio non soddisfatto</b>: PERC non negativa.'}</div>`)}
function pesiTool(){setTimeout(()=>details(`<table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>Età</td><td>= anni</td></tr><tr><td>Sesso maschile</td><td>+10</td></tr><tr><td>Neoplasia</td><td>+30</td></tr><tr><td>Scompenso</td><td>+10</td></tr><tr><td>BPCO</td><td>+10</td></tr><tr><td>FC ≥110</td><td>+20</td></tr><tr><td>PAS &lt;100</td><td>+30</td></tr><tr><td>FR ≥30</td><td>+20</td></tr><tr><td>T &lt;36°C</td><td>+20</td></tr><tr><td>Alterazione stato mentale</td><td>+60</td></tr><tr><td>SatO₂ &lt;90%</td><td>+20</td></tr></table>`),0);return shell("PESI","Pulmonary Embolism Severity Index per la prognosi della TEP.",["TEP","Prognosi","Dettagli completi"],`<form id="f_pesi"><div class="form-grid"><div class="field"><label>Età (anni)</label><input id="pe_age" type="number" min="0" step="1" /></div><div class="field"><label>Sesso</label><select id="pe_sex"><option value="0">Femmina</option><option value="10">Maschio</option></select></div>${cb('pe_cancer','Neoplasia')}${cb('pe_hf','Scompenso cardiaco')}${cb('pe_copd','BPCO')}${cb('pe_hr','FC ≥110/min')}${cb('pe_sbp','PAS <100 mmHg')}${cb('pe_rr','FR ≥30/min')}${cb('pe_temp','Temperatura <36°C')}${cb('pe_mental','Alterazione stato mentale')}${cb('pe_sat','SatO₂ <90%')}</div><div class="actions"><button type="button" class="primary" onclick="calcPesi()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_pesi')">Reset</button></div></form>`)}
function calcPesi(){const score=num('pe_age')+selNum('pe_sex')+30*checked('pe_cancer')+10*checked('pe_hf')+10*checked('pe_copd')+20*checked('pe_hr')+30*checked('pe_sbp')+20*checked('pe_rr')+20*checked('pe_temp')+60*checked('pe_mental')+20*checked('pe_sat');setResult(`<h3>Risultato</h3><div class="big">${Math.round(score)}</div><div class="interp"><b>${interpPesi(score)}</b>.</div>`)}
function spesiTool(){setTimeout(()=>details(`<table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>Età >80</td><td>1</td></tr><tr><td>Neoplasia</td><td>1</td></tr><tr><td>Scompenso o BPCO</td><td>1</td></tr><tr><td>FC ≥110</td><td>1</td></tr><tr><td>PAS &lt;100</td><td>1</td></tr><tr><td>SatO₂ &lt;90%</td><td>1</td></tr></table><p>0 = basso rischio; ≥1 = rischio aumentato.</p>`),0);return shell("sPESI","Versione semplificata del PESI.",["TEP","Prognosi"],`<form id="f_spesi"><div class="form-grid">${cb('s_age','Età > 80 anni')}${cb('s_cancer','Neoplasia')}${cb('s_hf_copd','Scompenso o BPCO')}${cb('s_hr','FC ≥110/min')}${cb('s_sbp','PAS <100 mmHg')}${cb('s_sat','SatO₂ <90%')}</div><div class="actions"><button type="button" class="primary" onclick="calcSpesi()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_spesi')">Reset</button></div></form>`)}
function calcSpesi(){const score=['s_age','s_cancer','s_hf_copd','s_hr','s_sbp','s_sat'].reduce((s,id)=>s+checked(id),0);setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp">${score===0?'<b>Basso rischio</b>.':'<b>Rischio aumentato</b>.'}</div>`)}
function bovaTool(){setTimeout(()=>details(`<table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>PAS 90–100 mmHg</td><td>2</td></tr><tr><td>Troponina elevata</td><td>2</td></tr><tr><td>Disfunzione VD</td><td>2</td></tr><tr><td>FC ≥110/min</td><td>1</td></tr></table><p>0–2 stadio I, 3–4 stadio II, &gt;4 stadio III.</p>`),0);return shell("Bova score","Rischio di complicanze a breve termine nella TEP normotesa.",["TEP","Deterioramento"],`<form id="f_bova"><div class="form-grid">${cb('b_sbp','PAS 90–100 mmHg')}${cb('b_trop','Troponina elevata')}${cb('b_rv','Disfunzione ventricolo destro')}${cb('b_hr','FC ≥110/min')}</div><div class="actions"><button type="button" class="primary" onclick="calcBova()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_bova')">Reset</button></div></form>`)}
function calcBova(){const score=2*checked('b_sbp')+2*checked('b_trop')+2*checked('b_rv')+checked('b_hr');const st=score<=2?'Stadio I':score<=4?'Stadio II':'Stadio III';setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp"><b>${st}</b>.</div>`)}
function heartTool(){setTimeout(()=>details(`<table class="table"><tr><th>Componente</th><th>0</th><th>1</th><th>2</th></tr><tr><td>History</td><td>Lieve sospetto</td><td>Moderato</td><td>Forte sospetto</td></tr><tr><td>ECG</td><td>Normale</td><td>Aspecifico</td><td>ST depression</td></tr><tr><td>Age</td><td>&lt;45</td><td>45–64</td><td>≥65</td></tr><tr><td>Risk factors</td><td>Nessuno</td><td>1–2</td><td>≥3 o aterosclerosi nota</td></tr><tr><td>Troponin</td><td>Normale</td><td>1–3x</td><td>&gt;3x limite</td></tr></table><p>0–3 basso, 4–6 intermedio, 7–10 alto.</p>`),0);return shell("HEART score","Stratificazione del dolore toracico in PS/setting acuto.",["SCA","Dolore toracico","Dettagli completi"],`<form id="f_heart"><div class="form-grid"><div class="field"><label>History</label><select id="he_hist"><option value="0">Lieve sospetto</option><option value="1">Moderato</option><option value="2">Forte sospetto</option></select></div><div class="field"><label>ECG</label><select id="he_ecg"><option value="0">Normale</option><option value="1">Alterazioni aspecifiche</option><option value="2">ST depression significativa</option></select></div><div class="field"><label>Età</label><select id="he_age"><option value="0">&lt;45</option><option value="1">45–64</option><option value="2">≥65</option></select></div><div class="field"><label>Risk factors</label><select id="he_rf"><option value="0">Nessuno</option><option value="1">1–2 fattori</option><option value="2">≥3 o aterosclerosi nota</option></select></div><div class="field full"><label>Troponina</label><select id="he_trop"><option value="0">Normale</option><option value="1">1–3 × limite superiore</option><option value="2">&gt;3 × limite superiore</option></select></div></div><div class="actions"><button type="button" class="primary" onclick="calcHeart()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_heart')">Reset</button></div></form>`)}
function calcHeart(){const score=['he_hist','he_ecg','he_age','he_rf','he_trop'].reduce((s,id)=>s+selNum(id),0);const cls=score<=3?'Basso rischio':score<=6?'Rischio intermedio':'Alto rischio';setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp"><b>${cls}</b>.</div>`)}
function timiTool(){setTimeout(()=>details(`<table class="table"><tr><th>Criterio TIMI UA/NSTEMI</th><th>Punti</th></tr><tr><td>Età ≥65</td><td>1</td></tr><tr><td>≥3 fattori di rischio CAD</td><td>1</td></tr><tr><td>Stenosi coronarica nota ≥50%</td><td>1</td></tr><tr><td>Uso ASA ultimi 7 giorni</td><td>1</td></tr><tr><td>≥2 episodi anginosi in 24h</td><td>1</td></tr><tr><td>ST deviation</td><td>1</td></tr><tr><td>Marker elevati</td><td>1</td></tr></table>`),0);return shell("TIMI UA/NSTEMI","Score classico per ACS senza sopraslivellamento ST.",["SCA","Dettagli completi"],`<form id="f_timi"><div class="form-grid">${cb('ti_age','Età ≥65 anni')}${cb('ti_risk','≥3 fattori di rischio CAD')}${cb('ti_known','CAD nota ≥50%')}${cb('ti_asa','ASA negli ultimi 7 giorni')}${cb('ti_angina','≥2 episodi anginosi ultime 24h')}${cb('ti_st','ST deviation')}${cb('ti_mark','Biomarcatori elevati')}</div><div class="actions"><button type="button" class="primary" onclick="calcTimi()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_timi')">Reset</button></div></form>`)}
function calcTimi(){const score=['ti_age','ti_risk','ti_known','ti_asa','ti_angina','ti_st','ti_mark'].reduce((s,id)=>s+checked(id),0);setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp">TIMI UA/NSTEMI: <b>${score}/7</b>.</div>`)}
function daptTool(){setTimeout(()=>details(`<p>Versione pratica semplificata del DAPT score.</p><table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>Età 65–74 / ≥75</td><td>-1 / -2</td></tr><tr><td>Fumatore</td><td>+1</td></tr><tr><td>Diabete</td><td>+1</td></tr><tr><td>MI pregresso / alla presentazione</td><td>+1</td></tr><tr><td>PCI/MI pregresso</td><td>+1</td></tr><tr><td>Stent piccolo / vena graft / CHF-LVEF bassa</td><td>+1 / +2</td></tr></table><p>≥2 può favorire prolungamento DAPT se bleeding acceptable.</p>`),0);return shell("DAPT score","Valutazione beneficio/rischio del prolungamento della doppia antiaggregazione.",["SCA","Antitrombotici"],`<form id="f_dapt"><div class="form-grid"><div class="field"><label>Età</label><select id="da_age"><option value="0">&lt;65</option><option value="-1">65–74</option><option value="-2">≥75</option></select></div>${cb('da_smoke','Fumatore')}${cb('da_dm','Diabete')}${cb('da_mi','MI alla presentazione')}${cb('da_prev','Pregresso MI o PCI')}${cb('da_small','Stent <3 mm')}${cb('da_chf','CHF o FE <30%')}${cb('da_graft','PCI su vena graft')}</div><div class="actions"><button type="button" class="primary" onclick="calcDapt()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_dapt')">Reset</button></div></form>`)}
function calcDapt(){const score=selNum('da_age')+checked('da_smoke')+checked('da_dm')+checked('da_mi')+checked('da_prev')+checked('da_small')+2*checked('da_chf')+2*checked('da_graft');setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp">${score>=2?'<b>Possibile beneficio</b> da DAPT prolungata.':'<b>Beneficio meno evidente</b> da DAPT prolungata.'}</div><div class="note">Usare insieme al rischio di sanguinamento e al contesto clinico.</div>`)}
function preciseTool(){setTimeout(()=>details(`<p>Modulo pratico orientativo. Il PRECISE-DAPT completo richiede regressione/formula dedicata con età, clearance creatinina, Hb, leucociti e bleeding history.</p><table class="table"><tr><th>Variabile chiave</th></tr><tr><td>Età</td></tr><tr><td>Clearance creatinina</td></tr><tr><td>Emoglobina</td></tr><tr><td>Leucociti</td></tr><tr><td>Pregresso sanguinamento</td></tr></table>`),0);return shell("PRECISE-DAPT","Promemoria dettagliato delle variabili richieste.",["SCA","Antitrombotici"],`<form id="f_precise"><div class="form-grid"><div class="field"><label>Età</label><input id="pr_age" type="number" step="1" /></div><div class="field"><label>Clearance creatinina (mL/min)</label><input id="pr_crcl" type="number" step="0.1" /></div><div class="field"><label>Emoglobina (g/dL)</label><input id="pr_hb" type="number" step="0.1" /></div><div class="field"><label>Leucociti (10^9/L)</label><input id="pr_wbc" type="number" step="0.1" /></div>${cb('pr_bleed','Pregresso sanguinamento')}</div><div class="actions"><button type="button" class="primary" onclick="calcPrecise()">Valuta</button><button type="button" class="secondary" onclick="resetForm('f_precise')">Reset</button></div></form>`)}
function calcPrecise(){const alerts=[];if(num('pr_age')>=75)alerts.push('età avanzata');if(num('pr_crcl')&&num('pr_crcl')<60)alerts.push('clearance ridotta');if(num('pr_hb')&&num('pr_hb')<12)alerts.push('Hb bassa');if(num('pr_wbc')&&num('pr_wbc')>11)alerts.push('leucocitosi');if(checked('pr_bleed'))alerts.push('pregresso bleeding');setResult(`<h3>Valutazione pratica</h3><div class="interp">${alerts.length?'Fattori che spingono verso <b>maggiore rischio emorragico</b>: '+alerts.join(', ')+'.':'Nessun elemento maggiore inserito; per lo score formale serve la formula completa.'}</div>`)}
function egfrTool(){setTimeout(()=>details(`<p><b>CKD-EPI 2021 creatinina</b> (senza razza):</p><p>eGFR = 142 × min(Scr/k,1)<sup>a</sup> × max(Scr/k,1)<sup>-1.200</sup> × 0.9938<sup>Età</sup> × 1.012 [se femmina]</p><table class="table"><tr><th>Sesso</th><th>k</th><th>a</th></tr><tr><td>Femmina</td><td>0.7</td><td>-0.241</td></tr><tr><td>Maschio</td><td>0.9</td><td>-0.302</td></tr></table>`),0);return shell("eGFR CKD-EPI 2021","Stima della funzione renale in mL/min/1.73m².",["Utility","Renale","Dettagli completi"],`<form id="f_egfr"><div class="form-grid"><div class="field"><label>Età (anni)</label><input id="eg_age" type="number" min="1" step="1" /></div><div class="field"><label>Sesso</label><select id="eg_sex"><option value="F">Femmina</option><option value="M">Maschio</option></select></div><div class="field full"><label>Creatinina sierica (mg/dL)</label><input id="eg_scr" type="number" min="0" step="0.01" /></div></div><div class="actions"><button type="button" class="primary" onclick="calcEgfr()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_egfr')">Reset</button></div></form>`)}
function calcEgfr(){const age=num('eg_age'),scr=num('eg_scr'),sex=val('eg_sex');if(!age||!scr){setResult('<h3>Risultato</h3><div class="note">Inserisci età e creatinina.</div>');return}const k=sex==='F'?0.7:0.9;const a=sex==='F'?-0.241:-0.302;const sexFactor=sex==='F'?1.012:1;const ratio=scr/k;const egfr=142*Math.pow(Math.min(ratio,1),a)*Math.pow(Math.max(ratio,1),-1.200)*Math.pow(0.9938,age)*sexFactor;let stage=egfr>=90?'G1':egfr>=60?'G2':egfr>=45?'G3a':egfr>=30?'G3b':egfr>=15?'G4':'G5';setResult(`<h3>Risultato</h3><div class="big">${egfr.toFixed(1)}</div><div class="interp">eGFR <b>${stage}</b> mL/min/1.73m².</div>`)}
function cgTool(){setTimeout(()=>details(`<p><b>Cockcroft-Gault</b>:</p><p>CrCl = ((140 − età) × peso / (72 × creatinina)) × 0.85 [se femmina]</p>`),0);return shell("Cockcroft-Gault","Stima della clearance creatinina in mL/min.",["Utility","Renale"],`<form id="f_cg"><div class="form-grid"><div class="field"><label>Età</label><input id="cg_age" type="number" step="1" /></div><div class="field"><label>Peso (kg)</label><input id="cg_w" type="number" step="0.1" /></div><div class="field"><label>Creatinina (mg/dL)</label><input id="cg_scr" type="number" step="0.01" /></div><div class="field"><label>Sesso</label><select id="cg_sex"><option value="M">Maschio</option><option value="F">Femmina</option></select></div></div><div class="actions"><button type="button" class="primary" onclick="calcCg()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_cg')">Reset</button></div></form>`)}
function calcCg(){const age=num('cg_age'),w=num('cg_w'),scr=num('cg_scr');if(!age||!w||!scr){setResult('<h3>Risultato</h3><div class="note">Inserisci età, peso e creatinina.</div>');return}let crcl=((140-age)*w)/(72*scr);if(val('cg_sex')==='F')crcl*=0.85;setResult(`<h3>Risultato</h3><div class="big">${crcl.toFixed(1)}</div><div class="interp">Clearance creatinina stimata in mL/min.</div>`)}
function ldlTool(){setTimeout(()=>details(`<p><b>Formula di Friedewald</b>:</p><p>LDL = Colesterolo totale − HDL − (Trigliceridi / 5)</p><p>Validità limitata se TG elevati (tipicamente &gt;400 mg/dL) o in condizioni particolari.</p>`),0);return shell("LDL Friedewald","Calcolo LDL in mg/dL.",["Utility","Lipidi"],`<form id="f_ldl"><div class="form-grid"><div class="field"><label>Colesterolo totale</label><input id="ldl_tc" type="number" step="0.1" /></div><div class="field"><label>HDL</label><input id="ldl_hdl" type="number" step="0.1" /></div><div class="field full"><label>Trigliceridi</label><input id="ldl_tg" type="number" step="0.1" /></div></div><div class="actions"><button type="button" class="primary" onclick="calcLdl()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_ldl')">Reset</button></div></form>`)}
function calcLdl(){const tc=num('ldl_tc'),hdl=num('ldl_hdl'),tg=num('ldl_tg');if(!tc||!hdl||!tg){setResult('<h3>Risultato</h3><div class="note">Inserisci colesterolo totale, HDL e trigliceridi.</div>');return}const ldl=tc-hdl-(tg/5);setResult(`<h3>Risultato</h3><div class="big">${ldl.toFixed(1)}</div><div class="interp">LDL calcolato in mg/dL.</div><div class="note">${tg>400?'Trigliceridi elevati: formula di Friedewald poco affidabile.':''}</div>`)}
function qtcTool(){setTimeout(()=>details(`<table class="table"><tr><th>Formula</th><th>Espressione</th></tr><tr><td>Bazett</td><td>QT / √RR</td></tr><tr><td>Fridericia</td><td>QT / RR^(1/3)</td></tr></table><p>Inserire QT in ms e frequenza cardiaca in bpm.</p>`),0);return shell("QTc","Correzione del QT con formule di Bazett e Fridericia.",["Utility","ECG"],`<form id="f_qtc"><div class="form-grid"><div class="field"><label>QT misurato (ms)</label><input id="qt_ms" type="number" step="1" /></div><div class="field"><label>Frequenza cardiaca (bpm)</label><input id="qt_hr" type="number" step="1" /></div></div><div class="actions"><button type="button" class="primary" onclick="calcQtc()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_qtc')">Reset</button></div></form>`)}
function calcQtc(){const qt=num('qt_ms'),hr=num('qt_hr');if(!qt||!hr){setResult('<h3>Risultato</h3><div class="note">Inserisci QT e frequenza cardiaca.</div>');return}const rr=60/hr;const baz=qt/Math.sqrt(rr);const fri=qt/Math.cbrt(rr);setResult(`<h3>Risultato</h3><div class="interp"><b>Bazett:</b> ${baz.toFixed(0)} ms<br><b>Fridericia:</b> ${fri.toFixed(0)} ms</div>`)}
function bmiTool(){setTimeout(()=>details(`<p><b>BMI</b> = peso / altezza².</p><p><b>BSA Mosteller</b> = √((altezza cm × peso kg) / 3600).</p>`),0);return shell("BMI + BSA","Antropometria clinica rapida.",["Utility"],`<form id="f_bmi"><div class="form-grid"><div class="field"><label>Peso (kg)</label><input id="bm_w" type="number" step="0.1" /></div><div class="field"><label>Altezza (cm)</label><input id="bm_h" type="number" step="0.1" /></div></div><div class="actions"><button type="button" class="primary" onclick="calcBmi()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_bmi')">Reset</button></div></form>`)}
function calcBmi(){const w=num('bm_w'),hcm=num('bm_h');if(!w||!hcm){setResult('<h3>Risultato</h3><div class="note">Inserisci peso e altezza.</div>');return}const hm=hcm/100;const bmi=w/(hm*hm);const bsa=Math.sqrt((hcm*w)/3600);setResult(`<h3>Risultato</h3><div class="interp"><b>BMI:</b> ${bmi.toFixed(1)} kg/m²<br><b>BSA:</b> ${bsa.toFixed(2)} m²</div>`)}

function vexusTool(){setTimeout(()=>details(`<p><b>VExUS pratico (schema semplificato)</b></p><table class="table"><tr><th>Passo</th><th>Interpretazione</th></tr><tr><td>IVC &lt; 2.0 cm</td><td><b>VExUS 0</b>: congestione venosa sistemica non significativa.</td></tr><tr><td>IVC ≥ 2.0 cm + nessuna severa alterazione Doppler</td><td><b>VExUS 1</b></td></tr><tr><td>IVC ≥ 2.0 cm + 1 alterazione severa</td><td><b>VExUS 2</b></td></tr><tr><td>IVC ≥ 2.0 cm + ≥2 alterazioni severe</td><td><b>VExUS 3</b></td></tr></table><p><b>Alterazioni severe considerate:</b> flusso epatico con <i>S reversed</i>, vena porta con pulsatility ≥50%, flusso venoso intrarenale monophasic/discontinuo marcato.</p><p><b>Alterazioni lievi/moderate:</b> epatica con S blunted, porta 30–49%, intrarenale biphasic.</p><div class="warn">Questo modulo fornisce un <b>grading operativo</b> utile al bedside. L'interpretazione finale va integrata con quadro clinico, setting ventilatorio e qualità della finestra ecografica.</div>`),0);return shell("VExUS","Valutazione ecografica della congestione venosa sistemica con grading 0–3.",["Scompenso","Congestione","Eco bedside"],`<form id="f_vexus"><div class="form-grid"><div class="field"><label>Diametro IVC (cm)</label><input id="vex_ivc" type="number" min="0" step="0.1" /><small>Soglia pratica: <b>2.0 cm</b>.</small></div><div class="field"><label>Collassabilità IVC</label><select id="vex_ivc_coll"><option value="">Non specificata</option><option value=">50">&gt;50%</option><option value="20-50">20–50%</option><option value="<20">&lt;20%</option></select><small>Campo descrittivo, non determina da solo il grado.</small></div><div class="field"><label>Vene epatiche</label><select id="vex_hepatic"><option value="0">Normale (S &gt; D)</option><option value="1">Alterazione lieve/moderata (S blunted)</option><option value="2">Severa (S reversed)</option></select></div><div class="field"><label>Vena porta</label><select id="vex_portal"><option value="0">Normale (&lt;30%)</option><option value="1">Alterazione lieve/moderata (30–49%)</option><option value="2">Severa (≥50%)</option></select></div><div class="field full"><label>Vene intrarenali</label><select id="vex_renal"><option value="0">Normale (continuous)</option><option value="1">Alterazione lieve/moderata (biphasic)</option><option value="2">Severa (monophasic/discontinuous marcata)</option></select></div></div><div class="actions"><button type="button" class="primary" onclick="calcVexus()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_vexus')">Reset</button></div></form>`)}
function calcVexus(){const ivc=num('vex_ivc');if(!ivc){setResult('<h3>Risultato</h3><div class="note">Inserisci almeno il diametro della IVC.</div>');return}const hepatic=selNum('vex_hepatic');const portal=selNum('vex_portal');const renal=selNum('vex_renal');const severe=[hepatic,portal,renal].filter(x=>x===2).length;const moderate=[hepatic,portal,renal].filter(x=>x===1).length;let grade=0, label='', interp='';if(ivc<2){grade=0;label='Assenza di congestione venosa significativa';interp='IVC sotto la soglia pratica di 2.0 cm: quadro non compatibile con congestione sistemica significativa secondo schema VExUS semplificato.';}else{if(severe>=2){grade=3;label='Congestione venosa severa';interp='IVC dilatata con almeno due Doppler severamente patologici.';}else if(severe===1){grade=2;label='Congestione venosa moderata';interp='IVC dilatata con una alterazione Doppler severa.';}else{grade=1;label='Congestione lieve / iniziale';interp='IVC dilatata senza criteri Doppler severi; presenti reperti normali o solo lievi/moderati.';}}const coll=val('vex_ivc_coll');let extras=[];if(ivc>=2)extras.push('IVC dilatata');else extras.push('IVC non dilatata');if(coll)extras.push('collassabilità '+coll);if(hepatic===2)extras.push('epatiche severe');else if(hepatic===1)extras.push('epatiche lievemente/moderatamente alterate');if(portal===2)extras.push('porta severa');else if(portal===1)extras.push('porta lievemente/moderata');if(renal===2)extras.push('intrarenali severe');else if(renal===1)extras.push('intrarenali lievemente/moderate');const advice=grade<=1?'Integra con clinica, BNP, profilo destro e trend diuretico.':'Congestione rilevante: utile correlare con segni clinici, funzione renale, strategia di decongestione e trend seriali.';setResult(`<h3>Risultato</h3><div class="big">VExUS ${grade}</div><div class="interp"><b>${label}</b>.<br>${interp}</div><div class="note">Sintesi: ${extras.join(' • ')}.<br>${advice}</div>`)}

function hfpefTool(){setTimeout(()=>details(`<table class="table"><tr><th>Variabile</th><th>Punti</th></tr><tr><td>Heavy (BMI &gt;30)</td><td>2</td></tr><tr><td>Hypertensive (≥2 farmaci)</td><td>1</td></tr><tr><td>AF</td><td>3</td></tr><tr><td>Pulmonary HTN (PASP &gt;35)</td><td>1</td></tr><tr><td>Elder (&gt;60 anni)</td><td>1</td></tr><tr><td>Filling pressure (E/e' &gt;9)</td><td>1</td></tr></table><p>0–1 bassa probabilità; 2–5 intermedia; 6–9 alta.</p>`),0);return shell("H₂FPEF","Score clinico-eco per probabilità di HFpEF.",["Scompenso","Dettagli completi"],`<form id="f_hfpef"><div class="form-grid">${cb('hf_bmi','BMI > 30 kg/m²')}${cb('hf_rx','≥2 farmaci antipertensivi')}${cb('hf_af','Fibrillazione atriale')}${cb('hf_pht','PASP > 35 mmHg')}${cb('hf_age','Età > 60 anni')}${cb('hf_ee','E/e′ > 9')}</div><div class="actions"><button type="button" class="primary" onclick="calcHfpef()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_hfpef')">Reset</button></div></form>`)}
function calcHfpef(){const score=2*checked('hf_bmi')+checked('hf_rx')+3*checked('hf_af')+checked('hf_pht')+checked('hf_age')+checked('hf_ee');const cls=score<=1?'Bassa probabilità HFpEF':score<=5?'Probabilità intermedia':'Alta probabilità HFpEF';setResult(`<h3>Risultato</h3><div class="big">${score}</div><div class="interp"><b>${cls}</b>.</div>`)}
function infoTool(title,text,bullets){setTimeout(()=>details(`<p>${text}</p><ul>${bullets.map(x=>`<li>${x}</li>`).join('')}</ul>`),0);return `<section class="card"><h2>${title}</h2><p class="help">${text}</p><div class="badges">${bullets.map(b=>`<span class="badge">${b}</span>`).join('')}</div></section>`}
function hcmTool(){setTimeout(()=>details(`<p><b>Formula ESC HCM Risk-SCD a 5 anni</b>:</p><p><code class="inline">Probabilità = 1 − 0.998 ^ exp(PI)</code></p><p>dove <code class="inline">PI</code> = 0.15939858×MWT − 0.00294271×MWT² + 0.0259082×LAD + 0.00446131×LVOT + 0.4583082×FHx_SCD + 0.82639195×NSVT + 0.71650361×Syncope − 0.01799934×Età</p><table class="table"><tr><th>Variabile</th><th>Unità</th></tr><tr><td>MWT = maximal wall thickness</td><td>mm</td></tr><tr><td>LAD = diametro atriale sinistro</td><td>mm</td></tr><tr><td>LVOT = gradiente massimo a riposo/Valsalva</td><td>mmHg</td></tr><tr><td>FHx SCD, NSVT, sincope inspiegata</td><td>0/1</td></tr></table><p>Soglie pratiche ESC: <b>&lt;4%</b> basso rischio, <b>4–&lt;6%</b> intermedio, <b>≥6%</b> alto.</p><div class="warn">Uso previsto: pazienti con HCM, in genere <b>≥16 anni</b>, dopo valutazione iniziale. Non sostituisce il giudizio clinico e non copre tutte le situazioni particolari.</div>`),0);return shell("HCM Risk-SCD","Calcolo del rischio di morte cardiaca improvvisa a 5 anni nella cardiomiopatia ipertrofica.",["Cardiomiopatie","5-year risk","ESC formula"],`<form id="f_hcm"><div class="form-grid"><div class="field"><label>Età (anni)</label><input id="hcm_age" type="number" min="16" step="1" /><small>Età alla valutazione clinica.</small></div><div class="field"><label>Spessore massimo parietale (MWT, mm)</label><input id="hcm_mwt" type="number" min="0" step="0.1" /><small>Massimo wall thickness.</small></div><div class="field"><label>Diametro atriale sinistro (LAD, mm)</label><input id="hcm_lad" type="number" min="0" step="0.1" /></div><div class="field"><label>Gradiente LVOT massimo (mmHg)</label><input id="hcm_lvot" type="number" min="0" step="0.1" /><small>Massimo a riposo o con Valsalva.</small></div>${cb('hcm_fhx','Familiarità per SCD')}${cb('hcm_nsvt','NSVT al monitoraggio')}${cb('hcm_syn','Sincope inspiegata')}</div><div class="actions"><button type="button" class="primary" onclick="calcHCM()">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_hcm')">Reset</button></div><div class="warn">Nota: ho usato la formula ESC classica. Nei pazienti con caratteristiche non coperte dal modello, la decisione su ICD va integrata con il resto del profilo clinico.</div></form>`)}
function calcHCM(){const age=num('hcm_age'),mwt=num('hcm_mwt'),lad=num('hcm_lad'),lvot=num('hcm_lvot'),fhx=checked('hcm_fhx'),nsvt=checked('hcm_nsvt'),syn=checked('hcm_syn');if(!age||!mwt||isNaN(lad)||isNaN(lvot)){setResult(`<h3>Risultato</h3><div class="note">Inserisci almeno età, MWT, LAD e gradiente LVOT.</div>`);return}const pi=(0.15939858*mwt)-(0.00294271*mwt*mwt)+(0.0259082*lad)+(0.00446131*lvot)+(0.4583082*fhx)+(0.82639195*nsvt)+(0.71650361*syn)-(0.01799934*age);const risk=(1-Math.pow(0.998,Math.exp(pi)))*100;let cls='Basso rischio';if(risk>=6)cls='Alto rischio';else if(risk>=4)cls='Rischio intermedio';setResult(`<h3>Risultato</h3><div class="big">${risk.toFixed(1)}%</div><div class="interp">Rischio stimato di SCD a 5 anni: <b>${cls}</b>.</div><div class="note">PI = ${pi.toFixed(3)}. Soglie pratiche ESC: &lt;4% basso, 4–&lt;6% intermedio, ≥6% alto.</div>`)}
openTool(state.current);renderMenu();
</script>
</body></html>
