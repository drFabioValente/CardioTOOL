<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CardioTools Pro — GRACE, RoPE, PASCAL e score cardiologici</title>
<style>
:root{--bg:#0b1020;--panel:#151d38;--panel2:#1a2345;--border:#2a3568;--txt:#edf2ff;--muted:#aeb8d8}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);background:radial-gradient(850px 500px at 15% 10%,#203063 0%,transparent 60%),radial-gradient(900px 500px at 85% 85%,#431424 0%,transparent 55%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #85b6ff;outline-offset:2px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100dvh}.sidebar{border-right:1px solid var(--border);background:rgba(10,14,28,.8);padding:16px 14px 20px;display:flex;flex-direction:column;min-height:0}.brand{padding:8px 8px 14px}.brand h1{margin:0;font-size:1.35rem}.brand p{margin:.25rem 0 0;color:var(--muted);font-size:.88rem}.searchbox{margin:4px 4px 10px}.searchbox input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--txt);outline:none}.side-scroll{overflow-y:auto;min-height:0;padding-right:4px;-webkit-overflow-scrolling:touch;touch-action:pan-y}.section-title{margin:16px 8px 8px;color:#cfd8ff;opacity:.8;font-size:.73rem;text-transform:uppercase;letter-spacing:.11em}
.btn{width:calc(100% - 8px);border:1px solid var(--border);background:linear-gradient(180deg,#1a2345 0%,#141c35 100%);color:var(--txt);border-radius:12px;padding:11px 12px;text-align:left;margin:0 4px 8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}.btn:hover{border-color:#4a61b7}.btn.active{outline:2px solid rgba(87,166,255,.48)}.btn .left{display:flex;flex-direction:column;gap:2px;min-width:0}.btn .name{font-weight:700}.btn .meta{font-size:.78rem;color:var(--muted)}.fav{flex:none;border:none;background:transparent;color:#ffd86b;font-size:1.15rem;cursor:pointer;padding:5px}
.main{min-width:0;overflow:auto;padding:24px}.card{background:rgba(18,25,51,.9);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px}.hero h2{margin:.1rem 0 .35rem}.hero p{color:var(--muted);line-height:1.5}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.badge{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:6px 10px;color:#dce6ff;font-size:.82rem}.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;margin-top:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{border:1px solid var(--border);border-radius:14px;padding:12px;background:rgba(26,35,69,.55);min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:.9rem;margin-bottom:8px;font-weight:600}.field small{display:block;color:var(--muted);margin-top:6px}.field input,.field select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid #3a487f;background:#0e152b;color:var(--txt);min-width:0}.checkbox{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:rgba(26,35,69,.45);line-height:1.4;cursor:pointer}.checkbox input{margin-top:3px;flex:none;accent-color:#6095ff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}.primary{border:1px solid #4f7fff;background:linear-gradient(180deg,#4f86ff,#3467dd);color:white}.secondary{border:1px solid var(--border);background:#111936;color:var(--txt)}.result h3{margin:0 0 8px}.result .big{font-size:2rem;font-weight:800;margin:6px 0;overflow-wrap:anywhere}.result .interp{color:#dfe8ff;line-height:1.55}.result .note{color:var(--muted);font-size:.92rem;margin-top:10px;line-height:1.5}.table{width:100%;border-collapse:collapse;margin-top:8px}.table th,.table td{border-bottom:1px solid #2a3568;padding:8px 6px;text-align:left;font-size:.88rem;vertical-align:top}.empty{text-align:center;padding:42px 18px;color:var(--muted)}.help{color:var(--muted);font-size:.92rem;line-height:1.5}.help a{color:#a5c7ff}.warn{border:1px solid #6e5c20;background:rgba(255,176,32,.08);color:#ffe9b0;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.92rem;line-height:1.45}code.inline{background:#0e152b;padding:2px 6px;border-radius:6px}h3{line-height:1.3}footer{margin:20px auto 8px;color:var(--muted);font-size:.78rem;text-align:center;max-width:700px}
@media(max-width:980px){.app{grid-template-columns:1fr;grid-template-rows:minmax(160px,29dvh) minmax(0,1fr)}.sidebar{border-right:none;border-bottom:1px solid var(--border);padding:9px 10px}.brand{padding:3px 5px 5px}.brand h1{font-size:1.15rem}.brand p{font-size:.78rem}.searchbox{margin:3px 3px 5px}.searchbox input{padding:8px}.hero,.grid{grid-template-columns:1fr}.main{padding:14px}.card{padding:16px}.form-grid{grid-template-columns:1fr}.grid{margin-top:14px}}
@media print{.app{display:block;height:auto}.sidebar{display:none}.main{overflow:visible;padding:0}.card{box-shadow:none}.actions{display:none}body{background:#fff;color:#000}.card,.field{background:#fff;color:#000}.result .interp,.result .note,.help{color:#222}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><h1>CardioTools Pro</h1><p>Calcolatori cardiologici · funziona offline</p></div><div class="searchbox"><input id="search" type="search" placeholder="Cerca score..." aria-label="Cerca score"></div><nav class="side-scroll" id="menu" aria-label="Calcolatori"></nav></aside><main class="main" id="main"><div class="card">Caricamento…</div></main></div>
<script>
'use strict';
const groups=[{key:'daily',label:'Uso quotidiano'},{key:'tep',label:'TEP'},{key:'fa',label:'FA score'},{key:'sca',label:'SCA / Antitrombotici'},{key:'hf',label:'Scompenso / Congestione'},{key:'cardio',label:'Cardiomiopatie / Aritmie'},{key:'utility',label:'Utility cliniche'}];
const tools=[
{id:'chadsvasc',group:'fa',name:'CHA₂DS₂-VASc',meta:'Rischio tromboembolico FA',favorite:true},
{id:'hasbled',group:'fa',name:'HAS-BLED',meta:'Rischio emorragico',favorite:true},
{id:'orbit',group:'fa',name:'ORBIT',meta:'Rischio emorragico FA',favorite:true},
{id:'heart',group:'daily',name:'HEART',meta:'Dolore toracico',favorite:true},
{id:'grace',group:'sca',name:'GRACE',meta:'Mortalità intraospedaliera SCA',favorite:false},
{id:'wells',group:'tep',name:'Wells PE',meta:'Probabilità clinica TEP',favorite:true},
{id:'geneva',group:'tep',name:'Revised Geneva',meta:'Probabilità clinica TEP',favorite:true},
{id:'perc',group:'tep',name:'PERC',meta:'Rule-out TEP',favorite:true},
{id:'pesi',group:'tep',name:'PESI',meta:'Prognosi TEP',favorite:false},
{id:'spesi',group:'tep',name:'sPESI',meta:'Prognosi TEP',favorite:true},
{id:'bova',group:'tep',name:'Bova',meta:'Rischio deterioramento',favorite:false},
{id:'timi',group:'sca',name:'TIMI UA/NSTEMI',meta:'Rischio SCA',favorite:false},
{id:'dapt',group:'sca',name:'DAPT score',meta:'Prolungamento DAPT',favorite:false},
{id:'precise',group:'sca',name:'PRECISE-DAPT · orientativo',meta:'Valutazione qualitativa (non score)',favorite:false},
{id:'egfr',group:'utility',name:'eGFR CKD-EPI 2021',meta:'Funzione renale',favorite:true},
{id:'cg',group:'utility',name:'Cockcroft-Gault',meta:'Clearance creatinina',favorite:false},
{id:'ldl',group:'utility',name:'LDL Friedewald',meta:'Colesterolo LDL',favorite:false},
{id:'qtc',group:'utility',name:'QTc',meta:'Bazett / Fridericia',favorite:true},
{id:'bmi',group:'utility',name:'BMI + BSA',meta:'Antropometria',favorite:false},
{id:'vexus',group:'hf',name:'VExUS',meta:'Grading pratico',favorite:true},
{id:'hfpef',group:'hf',name:'H₂FPEF',meta:'Probabilità HFpEF',favorite:false},
{id:'hfapeff',group:'hf',name:'HFA-PEFF · informativo',meta:'Modulo non calcolabile',favorite:false},
{id:'hcm',group:'cardio',name:'HCM Risk-SCD',meta:'Rischio SCD a 5 anni',favorite:false}
];
let favSaved={};try{favSaved=JSON.parse(localStorage.getItem('cardio_favs_v2')||'{}')||{}}catch(e){}
const state={current:'grace',favorites:favSaved};
function isFav(id){return Object.prototype.hasOwnProperty.call(state.favorites,id)?!!state.favorites[id]:!!tools.find(t=>t.id===id)?.favorite}
function toggleFav(id,event){event.stopPropagation();state.favorites[id]=!isFav(id);try{localStorage.setItem('cardio_favs_v2',JSON.stringify(state.favorites))}catch(e){}renderMenu()}
function menuButton(t){const active=t.id===state.current?' active':'';return `<div class="btn${active}" role="group"><button class="btn-main" type="button" onclick="openTool('${t.id}')" style="flex:1;min-width:0;text-align:left;border:0;background:transparent;color:inherit;cursor:pointer;padding:0"><span class="left"><span class="name">${t.name}</span><span class="meta">${t.meta}</span></span></button><button type="button" class="fav" onclick="toggleFav('${t.id}',event)" aria-label="${isFav(t.id)?'Rimuovi dai':'Aggiungi ai'} preferiti">${isFav(t.id)?'★':'☆'}</button></div>`}
function renderMenu(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('it');let html='';const matches=t=>[t.name,t.meta].some(s=>s.toLocaleLowerCase('it').includes(q));const f=tools.filter(t=>isFav(t.id)&&matches(t));if(f.length){html+='<div class="section-title">Preferiti</div>';f.forEach(t=>html+=menuButton(t))}groups.forEach(g=>{const items=tools.filter(t=>t.group===g.key&&matches(t));if(items.length){html+=`<div class="section-title">${g.label}</div>`;items.forEach(t=>html+=menuButton(t))}});document.getElementById('menu').innerHTML=html||'<div class="empty">Nessun risultato</div>'}
document.getElementById('search').addEventListener('input',renderMenu);
function openTool(id){state.current=id;renderMenu();document.getElementById('main').innerHTML=renderTool(id);document.getElementById('main').scrollTop=0}
function val(id){return document.getElementById(id)?.value||''}
function num(id){const e=document.getElementById(id);return !e||e.value.trim()===''?NaN:Number(e.value)}
function selNum(id){return Number(val(id)||0)}
function checked(id){return document.getElementById(id)?.checked?1:0}
function setResult(html){const e=document.getElementById('result');if(e)e.innerHTML=html}
function resetForm(formId){document.getElementById(formId)?.reset();setResult('<h3>Risultato</h3><div class="note">Compila i campi e premi Calcola.</div>')}
function details(html){const e=document.getElementById('detailsBox');if(e)e.innerHTML=html}
function shell(title,subtitle,badges,formHtml){return `<div class="hero"><section class="card"><h2>${title}</h2><p>${subtitle}</p><div class="badges">${badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div></section><section class="card result" id="result" role="status" aria-live="polite"><h3>Risultato</h3><div class="note">Compila i campi e premi Calcola.</div></section></div><div class="grid"><section class="card">${formHtml}</section><section class="card help"><h3 style="margin-top:0">Dettagli di calcolo</h3><div id="detailsBox"></div></section></div><footer>Strumento di supporto clinico. Le stime non sostituiscono linee guida, validazione locale o giudizio medico. Non inserire dati identificativi del paziente.</footer>`}
function cb(id,label){return `<label class="checkbox"><input id="${id}" type="checkbox"><span>${label}</span></label>`}
function infoTool(title,text,bullets){return `<section class="card"><h2>${title}</h2><p class="help">${text}</p><div class="badges">${bullets.map(b=>`<span class="badge">${b}</span>`).join('')}</div><div class="warn">Non è disponibile un risultato numerico validato in questa versione.</div></section>`}
function field(id,label,min=0,max=200,step='any',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" min="${min}" max="${max}" step="${step}" required>${extra?`<small>${extra}</small>`:''}</div>`}
function select(id,label,opts){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>`}
function plainBox(id,fields,title,subtitle,badges,explain,notice=''){const content=fields.join('');const f=`<form id="f_${id}" onsubmit="event.preventDefault();calcConfigured('${id}')"><div class="form-grid">${content}</div><div class="actions"><button class="primary" type="submit">Calcola</button><button type="button" class="secondary" onclick="resetForm('f_${id}')">Reset</button></div>${notice?`<div class="warn">${notice}</div>`:''}</form>`;
const output=shell(title,subtitle,badges,f);queueMicrotask(()=>{if(state.current===id)details(explain)});return output}
function invalid(message='Controlla i campi numerici obbligatori e i rispettivi intervalli.'){setResult(`<h3>Controlla i dati</h3><div class="warn">${message}</div>`)}
function req(ids){return ids.every(id=>{const el=document.getElementById(id);return el&&el.value.trim()!==''&&el.validity.valid&&Number.isFinite(Number(el.value))})}
function show(primary,interpretation,note='',rows=[]){setResult(`<h3>Risultato</h3><div class="big">${primary}</div><div class="interp">${interpretation}</div>${note?`<div class="note">${note}</div>`:''}${rows.length?`<table class="table"><tr><th>Voce</th><th>Valore</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`:''}`)}
function fScore(ids){return ids.reduce((s,id)=>s+checked(id),0)}
function interpPesi(s){return s<=65?'Classe I — molto basso':s<=85?'Classe II — basso':s<=105?'Classe III — intermedio':s<=125?'Classe IV — alto':'Classe V — molto alto'}
const items={
 chadsvasc:{title:'CHA₂DS₂-VASc',subtitle:'Stima del rischio tromboembolico nella fibrillazione atriale.',badges:['FA','Stroke risk'],fields:[cb('c_hf','Scompenso cardiaco / FE ridotta'),cb('c_htn','Ipertensione'),cb('c_dm','Diabete mellito'),cb('c_stroke','Stroke/TIA/TE pregresso'),cb('c_vasc','Vasculopatia'),select('c_age','Età',[['0','<65'],['1','65–74'],['2','≥75']]),select('c_sex','Sesso',[['0','Maschio'],['1','Femmina']])],explain:'<p>1 punto: scompenso, ipertensione, diabete, vasculopatia, età 65–74, sesso femminile. 2 punti: età ≥75, stroke/TIA/TE pregresso.</p><p>Il sesso è un modificatore del rischio: evitare soglie indiscriminate in base al totale.</p>',run:()=>{const s=fScore(['c_hf','c_htn','c_dm','c_vasc'])+2*checked('c_stroke')+selNum('c_age')+selNum('c_sex');show(`${s} punti`,'CHA₂DS₂-VASc calcolato.','La decisione su anticoagulazione considera soglie specifiche per sesso, rischio assoluto e linee guida aggiornate.')}} ,
 hasbled:{title:'HAS-BLED',subtitle:'Identificazione dei fattori di rischio emorragico nella FA.',badges:['FA','Bleeding'],fields:[cb('h_htn','Ipertensione non controllata (PAS >160)'),cb('h_renal','Funzione renale alterata'),cb('h_liver','Funzione epatica alterata'),cb('h_stroke','Stroke pregresso'),cb('h_bleed','Pregresso bleeding/predisposizione'),cb('h_inr','INR labile (se VKA)'),cb('h_age','Età >65 anni'),cb('h_drugs','Farmaci predisponenti (antiaggreganti/FANS)'),cb('h_alcohol','Eccesso di alcol')],explain:'<p>1 punto per ciascun criterio (funzione renale ed epatica separatamente; farmaci e alcol separatamente). Totale 0–9.</p><p>≥3 indica maggior rischio e richiede correzione dei fattori modificabili, non sospensione automatica della terapia.</p>',run:()=>{const s=fScore(['h_htn','h_renal','h_liver','h_stroke','h_bleed','h_inr','h_age','h_drugs','h_alcohol']);show(`${s}/9`,s>=3?'Rischio emorragico elevato.':'Rischio emorragico inferiore alla soglia ≥3.','Lo score non costituisce di per sé una controindicazione all’anticoagulazione.')}} ,
 orbit:{title:'ORBIT',subtitle:'Rischio di sanguinamento nella FA.',badges:['FA','Bleeding'],fields:[cb('o_age','Età ≥75 anni'),cb('o_egfr','eGFR <60 mL/min/1,73 m²'),cb('o_antiplt','Antiaggregante concomitante'),cb('o_bleed','Storia di sanguinamento'),cb('o_anemia','Anemia o Hb ridotta')],explain:'<p>Età ≥75: 1; eGFR <60: 1; antiaggregante: 1; anamnesi di sanguinamento: 2; Hb ridotta/anemia: 2.</p><p>0–2 basso, 3 intermedio, ≥4 alto.</p>',run:()=>{const s=fScore(['o_age','o_egfr','o_antiplt'])+2*fScore(['o_bleed','o_anemia']);show(`${s}/7`,`Rischio ${s<=2?'basso':s===3?'intermedio':'alto'}.`)}} ,
 heart:{title:'HEART score',subtitle:'Stratificazione del rischio nel dolore toracico acuto.',badges:['SCA','Dolore toracico'],fields:[select('he_hist','History',[['0','Lieve sospetto'],['1','Moderato'],['2','Forte sospetto']]),select('he_ecg','ECG',[['0','Normale'],['1','Alterazioni aspecifiche'],['2','Deviazione ST significativa']]),select('he_age','Età',[['0','<45'],['1','45–64'],['2','≥65']]),select('he_rf','Fattori di rischio',[['0','Nessuno'],['1','1–2'],['2','≥3 o aterosclerosi nota']]),select('he_trop','Troponina',[['0','Normale'],['1','1–3× limite superiore'],['2','>3× limite superiore']])],explain:'<p>History, ECG, Age, Risk factors, Troponin: 0, 1 o 2 punti ciascuno. 0–3 basso, 4–6 intermedio, 7–10 alto.</p><p>Non usare in luogo dell’ECG seriato, degli algoritmi hs-cTn e dei percorsi per SCA.</p>',run:()=>{const s=['he_hist','he_ecg','he_age','he_rf','he_trop'].reduce((s,id)=>s+selNum(id),0);show(`${s}/10`,`Rischio ${s<=3?'basso':s<=6?'intermedio':'alto'}.`,'In caso di STEMI o presentazione ad alto rischio non attendere il punteggio per il percorso urgente.')}} ,
 wells:{title:'Wells PE',subtitle:'Probabilità clinica pre-test di embolia polmonare.',badges:['TEP','Probabilità clinica'],fields:[cb('w_dvt','Segni clinici TVP'),cb('w_alt','TEP più probabile di diagnosi alternativa'),cb('w_hr','FC >100/min'),cb('w_imm','Immobilizzazione ≥3 giorni o chirurgia ultime 4 settimane'),cb('w_prev','Pregressa TVP/TEP'),cb('w_hemo','Emottisi'),cb('w_cancer','Neoplasia attiva')],explain:'<p>Segni TVP 3; TEP più probabile 3; FC >100 1,5; immobilità/chirurgia 1,5; pregressa TVP/TEP 1,5; emottisi 1; neoplasia 1.</p><p>Modello a due livelli: ≤4 TEP improbabile, >4 TEP probabile.</p>',run:()=>{const s=3*fScore(['w_dvt','w_alt'])+1.5*fScore(['w_hr','w_imm','w_prev'])+fScore(['w_hemo','w_cancer']);show(s.toFixed(1),s>4?'TEP probabile.':'TEP improbabile.','Integra con algoritmo diagnostico, D-dimero adattato e imaging secondo indicazione.')}} ,
 geneva:{title:'Revised Geneva',subtitle:'Probabilità clinica pre-test di TEP.',badges:['TEP','Probabilità clinica'],fields:[cb('g_age','Età >65 anni'),cb('g_prev','Pregressa TVP/TEP'),cb('g_surg','Chirurgia/frattura nell’ultimo mese'),cb('g_cancer','Neoplasia attiva'),cb('g_legpain','Dolore unilaterale arto inferiore'),cb('g_hemo','Emottisi'),select('g_hr','FC',[['0','<75'],['3','75–94'],['5','≥95']]),cb('g_dvt','Dolore palpazione vene profonde + edema unilaterale')],explain:'<p>Età >65 1; TEV pregressa 3; chirurgia/frattura 2; neoplasia 2; dolore arto 3; emottisi 2; FC 75–94 3 o ≥95 5; segni TVP 4.</p><p>0–3 basso, 4–10 intermedio, ≥11 alto.</p>',run:()=>{const s=checked('g_age')+3*checked('g_prev')+2*fScore(['g_surg','g_cancer','g_hemo'])+3*checked('g_legpain')+selNum('g_hr')+4*checked('g_dvt');show(`${s} punti`,s>=11?'Alta probabilità.':s>=4?'Probabilità intermedia.':'Bassa probabilità.')}} ,
 perc:{title:'PERC rule',subtitle:'Criteri di esclusione TEP solo se probabilità clinica iniziale molto bassa.',badges:['TEP','Rule-out'],fields:[cb('p_age','Età <50 anni'),cb('p_hr','FC <100/min'),cb('p_sat','SpO₂ ≥95%'),cb('p_hemo','Assenza emottisi'),cb('p_est','Assenza estrogeni'),cb('p_surg','Assenza chirurgia/trauma recente'),cb('p_prev','Assenza pregressa TVP/TEP'),cb('p_dvt','Assenza segni di TVP')],explain:'<p>Per PERC negativa devono essere soddisfatti tutti gli otto criteri.</p><p><strong>Applicazione:</strong> soltanto dopo valutazione clinica che identifichi un rischio pre-test molto basso. Non utilizzare in pazienti ad alta probabilità.</p>',notice:'Seleziona soltanto i criteri verificati. Le caselle non selezionate impediscono di concludere PERC−.',run:()=>{const s=fScore(['p_age','p_hr','p_sat','p_hemo','p_est','p_surg','p_prev','p_dvt']);show(s===8?'PERC−':'PERC+',s===8?'8/8 criteri soddisfatti.':'Almeno un criterio non soddisfatto o non verificato.','PERC− è utile solo in pazienti già giudicati a probabilità pre-test molto bassa.')}} ,
 pesi:{title:'PESI',subtitle:'Pulmonary Embolism Severity Index.',badges:['TEP','Prognosi'],fields:[field('pe_age','Età (anni)',18,120,1),select('pe_sex','Sesso',[['0','Femmina'],['10','Maschio']]),cb('pe_cancer','Neoplasia'),cb('pe_hf','Scompenso'),cb('pe_copd','BPCO'),cb('pe_hr','FC ≥110'),cb('pe_sbp','PAS <100'),cb('pe_rr','FR ≥30'),cb('pe_temp','Temperatura <36°C'),cb('pe_mental','Alterazione stato mentale'),cb('pe_sat','SpO₂ <90%')],explain:'<p>Età in anni; maschio +10; neoplasia +30; scompenso +10; BPCO +10; FC ≥110 +20; PAS <100 +30; FR ≥30 +20; T <36°C +20; stato mentale alterato +60; SpO₂ <90% +20.</p><p>≤65 I, 66–85 II, 86–105 III, 106–125 IV, >125 V.</p>',run:()=>{if(!req(['pe_age']))return invalid();const s=num('pe_age')+selNum('pe_sex')+30*checked('pe_cancer')+10*fScore(['pe_hf','pe_copd'])+20*fScore(['pe_hr','pe_rr','pe_temp','pe_sat'])+30*checked('pe_sbp')+60*checked('pe_mental');show(`${s} punti`,interpPesi(s),'La classificazione prognostica non sostituisce l’accertamento di instabilità emodinamica o rischio intermedio-alto.')}} ,

 bova:{title:'Bova score',subtitle:'Rischio di complicanze nella TEP normotesa.',badges:['TEP','Deterioramento'],fields:[cb('b_sbp','PAS 90–100 mmHg'),cb('b_trop','Troponina elevata'),cb('b_rv','Disfunzione VD'),cb('b_hr','FC ≥110')],explain:'<p>PAS 90–100: 2; troponina: 2; disfunzione VD: 2; FC ≥110: 1.</p><p>0–2 stadio I; 3–4 stadio II; 5–7 stadio III.</p><p>Con instabilità emodinamica il percorso clinico è diverso: questo modello riguarda la TEP normotesa.</p>',run:()=>{const s=2*fScore(['b_sbp','b_trop','b_rv'])+checked('b_hr');show(`${s}/7`,`Stadio ${s<=2?'I':s<=4?'II':'III'}.`)}} ,

 dapt:{title:'DAPT score',subtitle:'Orientamento sul prolungamento della DAPT dopo PCI.',badges:['SCA','Antitrombotici'],fields:[select('da_age','Età',[['0','<65'],['-1','65–74'],['-2','≥75']]),cb('da_smoke','Fumatore'),cb('da_dm','Diabete'),cb('da_mi','MI alla presentazione'),cb('da_prev','Pregresso MI o PCI'),cb('da_small','Stent diametro <3 mm'),cb('da_pacli','Stent a rilascio di paclitaxel (storico)'),cb('da_chf','CHF o LVEF <30%'),cb('da_graft','PCI su graft venoso')],explain:'<p>Età 65–74: −1; ≥75: −2; fumo +1; diabete +1; MI alla presentazione +1; MI/PCI pregresso +1; stent <3mm +1; stent paclitaxel +1; CHF/LVEF <30% +2; graft venoso +2.</p><p>≥2 può identificare beneficio netto da prolungamento in soggetti selezionati, dopo 12 mesi senza eventi.</p>',run:()=>{const s=selNum('da_age')+fScore(['da_smoke','da_dm','da_mi','da_prev','da_small','da_pacli'])+2*fScore(['da_chf','da_graft']);show(`${s} punti`,s>=2?'Potenziale beneficio da DAPT prolungata in pazienti selezionati.':'Beneficio del prolungamento meno evidente.','Da applicare solo nel contesto appropriato e con valutazione separata del rischio emorragico.')}} ,

 egfr:{title:'eGFR CKD-EPI 2021',subtitle:'Stima della filtrazione glomerulare da creatinina, senza razza.',badges:['Utility','Renale'],fields:[field('eg_age','Età (anni)',18,120,1),select('eg_sex','Sesso',[['F','Femmina'],['M','Maschio']]),field('eg_scr','Creatinina (mg/dL)',0.1,20,0.01)],explain:'<p>eGFR = 142 × min(Scr/k, 1)^a × max(Scr/k, 1)^−1,2 × 0,9938^età × 1,012 se femmina.</p><p>Femmina: k=0,7; a=−0,241. Maschio: k=0,9; a=−0,302.</p><p>Le categorie G1–G5 non definiscono da sole malattia renale cronica.</p>',run:()=>{if(!req(['eg_age','eg_scr']))return invalid();const age=num('eg_age'),scr=num('eg_scr'),sex=val('eg_sex'),k=sex==='F'?.7:.9,a=sex==='F'?-.241:-.302,r=scr/k;const e=142*Math.pow(Math.min(r,1),a)*Math.pow(Math.max(r,1),-1.2)*Math.pow(.9938,age)*(sex==='F'?1.012:1);const stage=e>=90?'G1':e>=60?'G2':e>=45?'G3a':e>=30?'G3b':e>=15?'G4':'G5';show(`${e.toFixed(1)} mL/min/1,73 m²`,`Categoria G: ${stage}.`,'Non equiparare automaticamente la categoria G a una diagnosi di CKD.')}} ,

 ldl:{title:'LDL Friedewald',subtitle:'Stima del colesterolo LDL (mg/dL).',badges:['Utility','Lipidi'],fields:[field('ldl_tc','Colesterolo totale',1,1000,0.1),field('ldl_hdl','HDL',1,300,0.1),field('ldl_tg','Trigliceridi',0,2000,0.1)],explain:'<p>LDL = colesterolo totale − HDL − trigliceridi/5 (tutti in mg/dL).</p><p>Non applicare se TG ≥400 mg/dL; possibile scarsa accuratezza a LDL bassi o TG elevati.</p>',run:()=>{if(!req(['ldl_tc','ldl_hdl','ldl_tg']))return invalid();const tc=num('ldl_tc'),hdl=num('ldl_hdl'),tg=num('ldl_tg');if(hdl>=tc)return invalid('HDL deve essere inferiore al colesterolo totale.');if(tg>=400)return invalid('TG ≥400 mg/dL: la formula di Friedewald non è applicabile.');const s=tc-hdl-tg/5;if(s<0)return invalid('Risultato negativo: valori non compatibili con la formula.');show(`${s.toFixed(1)} mg/dL`,'LDL calcolato con formula di Friedewald.')}} ,
 qtc:{title:'QTc',subtitle:'Correzione del QT con Bazett e Fridericia.',badges:['Utility','ECG'],fields:[field('qt_ms','QT misurato (ms)',100,900,1),field('qt_hr','Frequenza cardiaca (bpm)',20,250,1)],explain:'<p>Bazett QTc = QT/√RR. Fridericia QTc = QT/RR^(1/3), con RR = 60/FC in secondi.</p><p>Bazett tende a sovracorreggere alle frequenze elevate.</p>',run:()=>{if(!req(['qt_ms','qt_hr']))return invalid();const rr=60/num('qt_hr');show(`${(num('qt_ms')/Math.sqrt(rr)).toFixed(0)} ms`,'QTc Bazett.',`QTc Fridericia: ${(num('qt_ms')/Math.cbrt(rr)).toFixed(0)} ms.`)}} ,

 vexus:{title:'VExUS',subtitle:'Grading ecografico pratico della congestione venosa sistemica.',badges:['Scompenso','Eco bedside'],fields:[field('vex_ivc','IVC diametro (cm)',0.1,6,0.1),select('vex_ivc_coll','Collassabilità IVC',[['','Non specificata'],['>50','>50%'],['20–50','20–50%'],['<20','<20%']]),select('vex_hepatic','Vene epatiche',[['0','Normali'],['1','S blunted'],['2','S reversed']]),select('vex_portal','Vena porta',[['0','Pulsatilità <30%'],['1','30–49%'],['2','≥50%']]),select('vex_renal','Vene intrarenali',[['0','Continuo'],['1','Bifasico'],['2','Monofasico/discontinuo severo']])],explain:'<p><strong>Schema semplificato:</strong> IVC &lt;2 cm → 0; IVC ≥2 cm e nessuna alterazione Doppler severa → 1; una alterazione severa → 2; almeno due → 3.</p><p>Severo: epatiche S reversed, porta ≥50%, intrarenali monofasiche discontinue.</p><p>La collassabilità IVC è descrittiva, non modifica automaticamente il grado.</p>',run:()=>{if(!req(['vex_ivc']))return invalid();const ivc=num('vex_ivc'),severe=['vex_hepatic','vex_portal','vex_renal'].filter(id=>selNum(id)===2).length;const g=ivc<2?0:severe>=2?3:severe===1?2:1;show(`VExUS ${g}`,['Nessuna congestione venosa significativa secondo la soglia IVC semplificata.','Grado 1: IVC dilatata senza alterazioni Doppler severe.','Grado 2: IVC dilatata con una alterazione Doppler severa.','Grado 3: IVC dilatata con almeno due alterazioni Doppler severe.'][g],`Alterazioni Doppler severe: ${severe}. Collassabilità: ${val('vex_ivc_coll')||'non specificata'}. È uno schema operativo semplificato.`)}} ,

 hcm:{title:'HCM Risk-SCD',subtitle:'Rischio di morte cardiaca improvvisa a 5 anni nella HCM.',badges:['Cardiomiopatia','ESC','5 anni'],fields:[field('hcm_age','Età (anni)',16,120,1),field('hcm_mwt','Spessore massimo (mm)',5,70,0.1),field('hcm_lad','Atrio sinistro LAD (mm)',10,100,0.1),field('hcm_lvot','Gradiente LVOT massimo (mmHg)',0,250,0.1),cb('hcm_fhx','Familiarità per SCD'),cb('hcm_nsvt','NSVT'),cb('hcm_syn','Sincope inspiegata')],explain:'<p>PI = 0,15939858 × MWT − 0,00294271 × MWT² + 0,0259082 × LAD + 0,00446131 × LVOT + 0,4583082 × familiarità SCD + 0,82639195 × NSVT + 0,71650361 × sincope − 0,01799934 × età.</p><p>Rischio = 1 − 0,998 ^ exp(PI). &lt;4% basso; 4–&lt;6% intermedio; ≥6% alto.</p><p>Non applicabile indiscriminatamente a fenotipi o situazioni non comprese nella coorte originale.</p>',run:()=>{if(!req(['hcm_age','hcm_mwt','hcm_lad','hcm_lvot']))return invalid();const age=num('hcm_age'),mwt=num('hcm_mwt'),lad=num('hcm_lad'),lvot=num('hcm_lvot');const pi=.15939858*mwt-.00294271*mwt*mwt+.0259082*lad+.00446131*lvot+.4583082*checked('hcm_fhx')+.82639195*checked('hcm_nsvt')+.71650361*checked('hcm_syn')-.01799934*age;const r=100*(1-Math.pow(.998,Math.exp(pi)));show(`${r.toFixed(1)}%`,r>=6?'Rischio elevato.':r>=4?'Rischio intermedio.':'Rischio basso.',`PI ${pi.toFixed(3)}. La decisione su ICD richiede valutazione clinica complessiva.`)}}

<script>
/*
 * CardioTools Pro — aggiornamento GRACE / RoPE / PASCAL
 * Inserire <script src="CardioTools_Upgrade_GRACE_RoPE.js"><\/script>
 * subito prima di </body>, DOPO lo script originale dell'applicazione.
 * Versione 1.0 — 01/11/2026
 *
 * Riferimenti:
 * GRACE (nomogramma mortalità intraospedaliera, Granger 2003):
 * https://eguideline.guidelinecentral.com/i/589485-acute-coronary-syndromes-guidelines/5
 * Tertili NSTE-ACS: https://academic.oup.com/eurheartj/article/28/13/1598/2887402
 * RoPE / PASCAL: https://pmc.ncbi.nlm.nih.gov/articles/PMC11569559/
 * Coorte RoPE (prevalenza e frazione attribuibile):
 * https://www.ncbi.nlm.nih.gov/books/NBK592989/bin/Kent_RS-SCOPE-2019-001_Appendix_A2_T2.pdf
 */
(function () {
  'use strict';

  // L'app originale dichiara tools e groups con `const` nel primo script.
  if (typeof renderTool !== 'function' || typeof shell !== 'function' ||
      typeof tools === 'undefined' || typeof groups === 'undefined') {
    console.error('CardioTools upgrade: caricare questo script dopo il codice originale.');
    return;
  }

  const existingGrace = tools.find(t => t.id === 'grace');
  if (existingGrace) existingGrace.meta = 'Mortalità intraospedaliera SCA · calcolo attivo';
  if (!groups.some(g => g.key === 'pfo'))
    groups.push({key: 'pfo', label: 'PFO / Stroke criptogenetico'});
  if (!tools.some(t => t.id === 'rope'))
    tools.push({id:'rope', group:'pfo', name:'RoPE + PASCAL',
      meta:'PFO in ictus criptogenetico · causalità', favorite:false});

  // Il renderTool originale istanziava simultaneamente TUTTI i moduli:
  // i timer dei "Dettagli di calcolo" si sovrascrivevano. Dispatch lazy.
  const renderers = {
    heart: () => heartTool(), chadsvasc: () => chadsTool(),
    hasbled: () => hasbledTool(), orbit: () => orbitTool(),
    grace: () => graceTool(), wells: () => wellsTool(),
    geneva: () => genevaTool(), perc: () => percTool(),
    pesi: () => pesiTool(), spesi: () => spesiTool(),
    bova: () => bovaTool(), timi: () => timiTool(),
    dapt: () => daptTool(), precise: () => preciseTool(),
    egfr: () => egfrTool(), cg: () => cgTool(),
    ldl: () => ldlTool(), qtc: () => qtcTool(),
    bmi: () => bmiTool(), vexus: () => vexusTool(),
    hfpef: () => hfpefTool(), hcm: () => hcmTool(),
    rope: () => ropeTool(),
    hfapeff: () => infoTool('HFA-PEFF',
      'Algoritmo strutturato nei domini funzionale, morfologico e biomarcatori. ' +
      'Richiede una schermata dedicata con dati ecocardiografici e peptidi natriuretici.',
      ['Dominio funzionale','Dominio morfologico','Biomarcatori',
       'Stress test / cateterismo se indeterminato'])
  };
  renderTool = function (id) {
    return renderers[id] ? renderers[id]() :
      '<section class="card"><div class="empty">Modulo non disponibile.</div></section>';
  };

  // Helpers puri e testabili.
  function band(x, limits, values) {
    for (let i=0; i<limits.length; i++) if (x < limits[i]) return values[i];
    return values[values.length-1];
  }
  function graceComponents(age, hr, sbp, cr, killip, arrest, st, troponin) {
    const parts = {
      'Età': band(age, [31,40,50,60,70,80,90], [0,8,25,41,58,75,91,100]),
      'Frequenza cardiaca': band(hr, [51,70,90,110,150,200], [0,3,9,15,24,38,46]),
      'Pressione sistolica': band(sbp, [81,100,120,140,160,200], [58,53,43,34,24,10,0]),
      'Creatinina': band(cr, [0.4,0.8,1.2,1.6,2,4], [1,4,7,10,13,21,28]),
      'Classe Killip': [0,20,39,59][killip-1],
      'Arresto all’ingresso': arrest ? 39 : 0,
      'Deviazione ST': st ? 28 : 0,
      'Biomarcatori elevati': troponin ? 14 : 0
    };
    return { parts, score: Object.values(parts).reduce((a,b) => a+b,0) };
  }
  function graceMortality(score) {
    // Punti -> mortalità intraospedaliera (%), nomogramma classico.
    const xs = [60,70,80,90,100,110,120,130,140,150,160,170,180,190,200,210,220,230,240,250];
    const ys = [0.2,0.3,0.4,0.6,0.8,1.1,1.6,2.1,2.9,3.9,5.4,7.3,9.8,13,18,23,29,36,44,52];
    if (score <= 60) return '≤0,2%';
    if (score >= 250) return '≥52%';
    for (let i=0; i<xs.length-1; i++) {
      if (score <= xs[i+1]) {
        const estimate = ys[i] + (score-xs[i])*(ys[i+1]-ys[i])/(xs[i+1]-xs[i]);
        return '≈' + estimate.toFixed(1).replace('.', ',') + '%';
      }
    }
    return 'n/d';
  }
  function readRequiredNumber(id, lo, hi) {
    const element = document.getElementById(id);
    if (!element || element.value.trim()==='') return null;
    const n = Number(element.value);
    return Number.isFinite(n) && n >= lo && n <= hi ? n : null;
  }
  function scheduleDetails(html, id) {
    setTimeout(() => {
      if (state.current === id && document.getElementById('detailsBox')) details(html);
    }, 0);
  }
  function reportProblem(message) {
    setResult('<h3>Controlla i dati</h3><div class="warn">' + message + '</div>');
  }

  function graceTool() {
    scheduleDetails(`
      <p><b>GRACE classico — mortalità intraospedaliera</b>. Somma dei punti attribuiti a 8 variabili.</p>
      <table class="table"><tr><th>Variabile</th><th>Punti</th></tr>
      <tr><td>Età ≤30 / 31–39 / 40–49 / 50–59 / 60–69 / 70–79 / 80–89 / ≥90 anni</td><td>0 / 8 / 25 / 41 / 58 / 75 / 91 / 100</td></tr>
      <tr><td>FC ≤50 / 51–69 / 70–89 / 90–109 / 110–149 / 150–199 / ≥200 bpm</td><td>0 / 3 / 9 / 15 / 24 / 38 / 46</td></tr>
      <tr><td>PAS ≤80 / 81–99 / 100–119 / 120–139 / 140–159 / 160–199 / ≥200 mmHg</td><td>58 / 53 / 43 / 34 / 24 / 10 / 0</td></tr>
      <tr><td>Creatinina &lt;0,4 / 0,4–0,79 / 0,8–1,19 / 1,2–1,59 / 1,6–1,99 / 2–3,99 / ≥4 mg/dL</td><td>1 / 4 / 7 / 10 / 13 / 21 / 28</td></tr>
      <tr><td>Killip I / II / III / IV</td><td>0 / 20 / 39 / 59</td></tr>
      <tr><td>Arresto all'ingresso</td><td>39</td></tr>
      <tr><td>Deviazione ST</td><td>28</td></tr>
      <tr><td>Biomarcatori elevati</td><td>14</td></tr></table>
      <p>Rischio intraospedaliero approssimato dal nomogramma pubblicato (interpolazione tra i punti tabulati).</p>
      <p>Classi <b>NSTE-ACS</b>: ≤108 basso, 109–140 intermedio, &gt;140 alto. La scelta STEMI applica soglie di categoria differenti.</p>
      <div class="warn">Questo non è GRACE 2.0 e non stima la mortalità a 6 mesi. Non usare da solo per decidere timing o terapia.</div>
      <p><a href="https://eguideline.guidelinecentral.com/i/589485-acute-coronary-syndromes-guidelines/5" target="_blank" rel="noopener" style="color:#a5c7ff">Nomogramma GRACE originale</a></p>
    `, 'grace');
    return shell('GRACE — SCA',
      'GRACE classico: punteggio e rischio stimato di mortalità intraospedaliera nella sindrome coronarica acuta.',
      ['GRACE 1.0', '8 variabili', 'Calcolo attivo', 'Mortalità in ospedale'],
      `<form id="f_grace"><div class="form-grid">
        <div class="field"><label for="gr_age">Età (anni)</label>
          <input id="gr_age" type="number" min="18" max="120" step="1" required /></div>
        <div class="field"><label for="gr_hr">FC all'ingresso (bpm)</label>
          <input id="gr_hr" type="number" min="20" max="300" step="1" required /></div>
        <div class="field"><label for="gr_sbp">PAS all'ingresso (mmHg)</label>
          <input id="gr_sbp" type="number" min="40" max="300" step="1" required /></div>
        <div class="field"><label for="gr_cr">Creatinina (mg/dL)</label>
          <input id="gr_cr" type="number" min="0.1" max="20" step="0.01" required />
          <small>Se disponibile in µmol/L, dividere per 88,4.</small></div>
        <div class="field"><label for="gr_killip">Classe Killip</label><select id="gr_killip">
          <option value="1">I — senza segni di scompenso</option>
          <option value="2">II — congestione lieve</option>
          <option value="3">III — edema polmonare</option>
          <option value="4">IV — shock cardiogeno</option>
        </select></div>
        <div class="field"><label for="gr_acs">Tipo di SCA (per categoria di rischio)</label>
          <select id="gr_acs"><option value="nste">NSTE-ACS</option>
          <option value="stemi">STEMI</option></select></div>
        ${cb('gr_arrest','Arresto cardiaco alla presentazione')}
        ${cb('gr_st','Deviazione del tratto ST')}
        ${cb('gr_trop','Biomarcatori cardiaci elevati')}
      </div><div class="actions">
        <button type="button" class="primary" onclick="calcGraceUpgrade()">Calcola GRACE</button>
        <button type="button" class="secondary" onclick="resetForm('f_grace')">Reset</button>
      </div></form>`);
  }

  // Metodi invocati da onclick inline (devono essere esposti su window).
  window.calcGraceUpgrade = function () {
    const age=readRequiredNumber('gr_age',18,120);
    const hr=readRequiredNumber('gr_hr',20,300);
    const sbp=readRequiredNumber('gr_sbp',40,300);
    const cr=readRequiredNumber('gr_cr',0.1,20);
    if ([age,hr,sbp,cr].some(x => x===null)) {
      reportProblem('Inserisci età (18–120), FC (20–300), PAS (40–300) e creatinina (0,1–20 mg/dL). Nessun campo obbligatorio può essere vuoto.');
      return;
    }
    const acs=val('gr_acs');
    const {parts,score} = graceComponents(age,hr,sbp,cr,
      selNum('gr_killip'),!!checked('gr_arrest'),!!checked('gr_st'),!!checked('gr_trop'));
    const cls = acs==='stemi' ?
      (score <= 125 ? 'Basso' : score <= 154 ? 'Intermedio' : 'Alto') :
      (score <= 108 ? 'Basso' : score <= 140 ? 'Intermedio' : 'Alto');
    const rows = Object.entries(parts)
      .map(([k,v])=>`<tr><td>${k}</td><td>+${v}</td></tr>`).join('');
    setResult(`<h3>Risultato GRACE</h3>
      <div class="big">${score} punti</div>
      <div class="interp"><b>Rischio ${cls.toLowerCase()}</b> (${acs==='stemi'?'STEMI':'NSTE-ACS'}).<p>
      Mortalità intraospedaliera stimata: <b>${graceMortality(score)}</b>.</p></div>
      <div class="note">Stima da nomogramma del modello GRACE classico; non equivalente a GRACE 2.0.</div>
      <table class="table"><tr><th>Contributo</th><th>Punti</th></tr>${rows}</table>`);
  };

  function ropeLookup(score) {
    if (score<=3) return {range:'0–3', prevalence:23, attributed:0, ci:'0–4'};
    if (score===4) return {range:'4', prevalence:35, attributed:38, ci:'25–48'};
    if (score===5) return {range:'5', prevalence:34, attributed:34, ci:'21–45'};
    if (score===6) return {range:'6', prevalence:47, attributed:62, ci:'54–68'};
    if (score===7) return {range:'7', prevalence:54, attributed:72, ci:'66–76'};
    if (score===8) return {range:'8', prevalence:67, attributed:84, ci:'79–87'};
    return {range:'9–10', prevalence:73, attributed:88, ci:'83–91'};
  }
  function roAge(age) {
    return band(age, [30,40,50,60,70], [5,4,3,2,1,0]);
  }
  function selYN(id,label) {
    return `<div class="field"><label for="${id}">${label}</label><select id="${id}" required>
      <option value="" selected>Seleziona…</option>
      <option value="no">No</option><option value="si">Sì</option>
    </select></div>`;
  }
  function ropeTool() {
    scheduleDetails(`
      <p>Il <b>RoPE</b> (Risk of Paradoxical Embolism) si applica allo <b>stroke ischemico criptogenetico</b>, non allo screening del PFO nella popolazione generale.</p>
      <table class="table"><tr><th>Criterio</th><th>Punti</th></tr>
      <tr><td>Assenza di ipertensione</td><td>1</td></tr>
      <tr><td>Assenza di diabete</td><td>1</td></tr>
      <tr><td>Assenza di precedente ictus/TIA</td><td>1</td></tr>
      <tr><td>Non fumatore</td><td>1</td></tr>
      <tr><td>Infarto corticale all'imaging</td><td>1</td></tr>
      <tr><td>Età 18–29 / 30–39 / 40–49 / 50–59 / 60–69 / ≥70 anni</td><td>5 / 4 / 3 / 2 / 1 / 0</td></tr></table>
      <p><b>Coorti originali:</b> prevalenza del PFO per punteggio RoPE e frazione di stroke attribuibile al PFO (quando è presente) sono grandezze differenti.</p>
      <p><b>PASCAL:</b> RoPE ≥7 + shunt ampio e/o aneurisma del setto atriale (ASA) → <b>probabile</b> relazione causale. Se una sola condizione è presente → possibile; se nessuna → improbabile.</p>
      <div class="warn">RoPE e PASCAL non dimostrano causalità nel singolo caso e non sono indicazioni autonome alla chiusura percutanea. Necessaria esclusione delle altre cause di ictus.</div>
      <p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11569559/" target="_blank" rel="noopener" style="color:#a5c7ff">Linee guida ESO</a></p>
    `,'rope');
    return shell('RoPE + PASCAL — PFO',
      'Probabilità di riscontro di PFO e plausibilità della sua responsabilità in un ictus ischemico criptogenetico.',
      ['RoPE 0–10', 'PFO', 'Stroke criptogenetico', 'PASCAL'],
      `<form id="f_rope"><div class="form-grid">
        <div class="field"><label for="ro_age">Età (anni)</label>
          <input id="ro_age" type="number" min="18" max="120" step="1" required /></div>
        ${selYN('ro_htn','Ipertensione arteriosa')}
        ${selYN('ro_dm','Diabete mellito')}
        ${selYN('ro_stroke','Pregresso stroke o TIA (prima dell’evento indice)')}
        ${selYN('ro_smoke','Fumatore attivo')}
        ${selYN('ro_cortical','Infarto corticale all’imaging')}
        <div class="field"><label for="ro_pfo">Stato del PFO</label>
          <select id="ro_pfo"><option value="ignoto">Non noto / non ancora documentato</option>
            <option value="si">PFO documentato</option>
            <option value="no">PFO escluso</option></select></div>
        <div class="field"><label for="ro_morph">PFO con caratteristiche ad alto rischio</label>
          <select id="ro_morph"><option value="ignoto">Non valutate</option>
            <option value="no">Assenti</option>
            <option value="si">Shunt ampio e/o ASA</option></select>
          <small>Per PASCAL; considerato solo se il PFO è documentato.</small></div>
      </div><div class="actions">
        <button type="button" class="primary" onclick="calcRopeUpgrade()">Calcola RoPE / PASCAL</button>
        <button type="button" class="secondary" onclick="resetForm('f_rope')">Reset</button>
      </div><div class="warn">Destinato a pazienti adulti con ictus ischemico criptogenetico dopo appropriato iter eziologico.</div></form>`);
  }

  window.calcRopeUpgrade = function () {
    const age=readRequiredNumber('ro_age',18,120);
    const ids=['ro_htn','ro_dm','ro_stroke','ro_smoke','ro_cortical'];
    if (age===null || ids.some(id => !['si','no'].includes(val(id)))) {
      reportProblem('Inserisci un’età valida (18–120 anni) e scegli Sì/No per tutte le cinque caratteristiche cliniche.');
      return;
    }
    const positive = ids.map(id=>val(id)==='si');
    const parts={
      'Età': roAge(age),
      'Assenza di ipertensione': positive[0]?0:1,
      'Assenza di diabete': positive[1]?0:1,
      'Nessuno stroke/TIA pregresso': positive[2]?0:1,
      'Non fumatore': positive[3]?0:1,
      'Infarto corticale': positive[4]?1:0
    };
    const score = Object.values(parts).reduce((a,b)=>a+b,0);
    const stat = ropeLookup(score);
    const hasPFO=val('ro_pfo');
    const anatomy=val('ro_morph');
    let pascal='Non calcolabile';
    if (hasPFO==='si' && anatomy!=='ignoto') {
      const high=score>=7;
      pascal = high && anatomy==='si' ? 'Probabile' :
        (high || anatomy==='si' ? 'Possibile' : 'Improbabile');
    } else if (hasPFO==='no') {
      pascal='Non applicabile (PFO escluso)';
    } else if (hasPFO!=='si') {
      pascal='Non applicabile (PFO non documentato)';
    }
    const rows = Object.entries(parts)
      .map(([k,v])=>`<tr><td>${k}</td><td>+${v}</td></tr>`).join('');
    const fraction = hasPFO==='si' ?
      `<p>Frazione attribuibile stimata al PFO nello strato RoPE: <b>${stat.attributed}%</b> (IC 95% ${stat.ci}%).</p>` :
      '<p>Frazione attribuibile allo stroke: utilizzabile soltanto nel contesto di PFO effettivamente riscontrato.</p>';
    setResult(`<h3>Risultato RoPE</h3><div class="big">${score}/10</div>
      <div class="interp">Nelle coorti con stroke criptogenetico, la prevalenza di PFO per il gruppo RoPE ${stat.range} è <b>${stat.prevalence}%</b>.
      ${fraction}<p>Classificazione <b>PASCAL: ${pascal}</b>.</p></div>
      <div class="note">Valori epidemiologici per gruppi, non probabilità diagnostica individuale. 
      PASCAL richiede PFO documentato e valutazione delle caratteristiche anatomiche ad alto rischio.</div>
      <table class="table"><tr><th>Contributo</th><th>Punti</th></tr>${rows}</table>`);
  };

  // Espone soltanto le funzioni pure ai test, senza interferire con l'app.
  window.CardioUpgrade = {graceComponents, graceMortality, ropeLookup, roAge};
  if (typeof renderMenu === 'function') renderMenu();
  if (typeof openTool === 'function') openTool('grace');
})();

</script>
</body></html>
